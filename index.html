<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="쇠질모드">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>쇠질모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Black+Ops+One&family=Noto+Sans+KR:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #6b6b6b;
    --line: rgba(255, 255, 255, 0.14);
    --panel: rgba(255, 255, 255, 0.04);
    --btn-bg: #ffffff;
    --btn-fg: #000000;
    --btn-bg-alt: transparent;
    --btn-fg-alt: #ffffff;
    --danger: #ff3b30;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Malgun Gothic", sans-serif;
  }
  html { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 8px calc(16px + env(safe-area-inset-bottom));
    padding-left: max(8px, env(safe-area-inset-left));
    padding-right: max(8px, env(safe-area-inset-right));
    gap: clamp(14px, 3.5vmin, 32px);
    overflow: hidden;
  }

  .section {
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(12px, 2.4vmin, 16px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: clamp(6px, 1.6vmin, 14px);
  }

  /* 현재 시각 · 스톱워치 공통 숫자 스타일 (완전 동일) */
  .clock-time,
  .sw-time {
    font-family: 'Anton', 'Bebas Neue', 'Impact', sans-serif;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum' 1, 'lnum' 1;
    font-size: clamp(120px, 28vw, 320px);
    font-weight: 400;
    letter-spacing: 0;
    line-height: 0.9;
    color: var(--fg);
    display: block;
    text-align: center;
    white-space: nowrap;
  }
  .clock-time .digits,
  .sw-time .digits {
    display: inline-block;
    white-space: nowrap;
  }
  /* 각 자릿수 고정 너비 (숫자마다 폭 달라도 흔들리지 않음) */
  .digit {
    display: inline-block;
    width: 0.58em;
    text-align: center;
  }
  .colon {
    display: inline-block;
    width: 0.22em;
    text-align: center;
  }

  /* 스톱워치 패널 */
  .sw-panel {
    width: 100%;
    padding: clamp(8px, 1.6vmin, 16px) 0;
    background: transparent;
    border: none;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vmin, 28px);
  }
  .sw-time .unit {
    font-family: 'Black Han Sans', 'Anton', sans-serif;
    font-size: 0.34em;
    color: var(--muted);
    font-weight: 400;
    margin: 0 clamp(4px, 1vmin, 12px) 0 clamp(2px, 0.6vmin, 6px);
    letter-spacing: 0;
    line-height: 1;
  }
  .sw-time .unit.dot {
    color: var(--fg);
    margin: 0 2px;
  }
  .sw-time .h, .sw-time .m, .sw-time .s, .sw-time .ds { line-height: 0.9; }
  .sw-time .hgrp, .sw-time .mgrp { display: none; align-items: baseline; }
  .sw-time .hgrp.show, .sw-time .mgrp.show { display: inline-flex; }
  .sw-time.running .ds { color: #ffffff; }

  .controls {
    display: flex;
    gap: clamp(8px, 2vmin, 16px);
    justify-content: center;
    align-items: center;
    width: fit-content;
    margin: 0 auto;
  }
  .btn {
    flex: 0 0 auto;
    min-width: clamp(130px, 34vw, 200px);
    padding: clamp(14px, 3vmin, 22px) clamp(20px, 4vmin, 32px);
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(15px, 3vmin, 22px);
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-radius: 100px;
    border: 1.5px solid var(--fg);
    cursor: pointer;
    transition: transform 0.12s ease, background 0.18s ease, color 0.18s ease;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
  .btn-primary.running {
    background: transparent;
    color: var(--fg);
    border-color: var(--fg);
  }
  .btn-secondary { background: var(--btn-bg-alt); color: var(--btn-fg-alt); }
  .btn-secondary:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* 상단 앱 헤더 (아이콘 + 명칭) */
  .app-header {
    position: fixed;
    top: max(14px, calc(env(safe-area-inset-top) + 6px));
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: clamp(3px, 0.8vmin, 6px);
    z-index: 20;
    pointer-events: none;
  }
  .app-icon {
    width: clamp(22px, 4.5vmin, 30px);
    height: clamp(22px, 4.5vmin, 30px);
    object-fit: contain;
    display: block;
    /* 원본: 흰 배경 + 회색 팔뚝
       → invert(1)로 배경을 검게, brightness(2)로 회색 팔을 흰색까지 밝힘
       → contrast로 극한값 밀지 않아서 원본 안티에일리어싱(굵기감) 유지 */
    filter: invert(1) brightness(2);
  }
  .app-title {
    /* Noto Sans KR Light(300)로 가장 얇게. Windows Malgun Gothic은 300 미지원이라 fallback */
    font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: clamp(16px, 2.8vmin, 22px);
    letter-spacing: 4px;
    color: var(--fg);
    line-height: 1;
    opacity: 0.9;
    font-weight: 300;
    padding-left: 2px; /* letter-spacing 보정으로 시각적 중앙 정렬 */
  }

  /* 은은한 heartbeat 도트 (측정중 표시) */
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--fg);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .live-dot.on {
    opacity: 1;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* ============ 가로 모드 (Landscape) ============ */
  @media (orientation: landscape) {
    body {
      /* 세로 스택 유지하되 gap 축소, vh 기반 폰트로 화면 폭 활용 */
      gap: clamp(10px, 2vh, 24px);
    }
    .clock-time,
    .sw-time {
      /* 버튼이 좌우 fixed로 빠지면서 세로 여유 확보 → 폰트 상향 */
      font-size: clamp(96px, 36vh, 340px);
      line-height: 0.9;
    }
    .sw-panel {
      padding: clamp(4px, 1vh, 12px) 0;
      gap: clamp(10px, 2.4vh, 22px);
    }
    .btn {
      padding: clamp(10px, 2vh, 16px) clamp(18px, 4vw, 32px);
      font-size: clamp(13px, 2.2vh, 18px);
    }
    .label {
      font-size: clamp(10px, 1.8vh, 14px);
      margin-bottom: clamp(3px, 0.8vh, 8px);
    }
    /* 가로 모드에서는 상단 헤더 숨김 */
    .app-header { display: none; }
  }

  /* ============ 방향별 살짝 스트레치 (5%) ============ */
  /* 가로 모드 → 가로로 아주 약간 늘림 */
  @media (orientation: landscape) {
    .clock-time,
    .sw-time {
      transform: scaleX(1.05);
      transform-origin: center;
    }
  }
  /* 세로 모드 → 세로로 아주 약간 늘림 */
  @media (orientation: portrait) {
    .clock-time,
    .sw-time {
      transform: scaleY(1.05);
      transform-origin: center;
    }
  }

  /* ============ 세로 모드: 숫자와 시작/초기화 버튼 사이 여백 살짝 확대 ============ */
  @media (orientation: portrait) {
    .sw-panel {
      gap: clamp(56px, 10vmin, 96px);
    }
    /* 시작 ↔ 초기화 버튼 간격도 살짝 확대 */
    .controls {
      gap: clamp(24px, 5vmin, 44px);
    }
  }

  /* ============ 가로 모드: 숫자 영역이 좌우 원형 버튼과 붙지 않도록 여백 확보 ============ */
  @media (orientation: landscape) {
    .section {
      /* 버튼 폭 + 바깥 gutter + 숫자↔버튼 사이 여백(20px) 만큼 좌우 안쪽으로 좁힘 */
      max-width: calc(100% - (clamp(96px, 22vh, 160px) + clamp(16px, 4vw, 48px) + 20px) * 2);
      margin-left: auto;
      margin-right: auto;
    }
  }

  /* ============ 가로 모드: 시작/초기화를 화면 좌우로 큰 원형 버튼 배치 ============ */
  @media (orientation: landscape) {
    .controls {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 48px);
      padding-left: max(clamp(16px, 4vw, 48px), env(safe-area-inset-left));
      padding-right: max(clamp(16px, 4vw, 48px), env(safe-area-inset-right));
      gap: 0;
      margin: 0;
      z-index: 10;
      pointer-events: none; /* 가운데 빈 공간은 클릭 통과 */
    }
    .controls .btn {
      aspect-ratio: 1;             /* 정사각(원형) — 가로세로 1:1 */
      width: clamp(96px, 22vh, 160px);
      min-width: 0;
      padding: 0;
      border-radius: 50%;
      letter-spacing: 2px;
      font-size: clamp(14px, 2.6vh, 20px);
      pointer-events: auto;
    }
  }
</style>
</head>
<body>
  <header class="app-header">
    <img class="app-icon" src="icon-192.png" alt="">
    <span class="app-title">쇠질모드</span>
  </header>

  <div class="section section-clock">
    <div class="label">Now</div>
    <div class="clock-time" id="clockTime">
      <span class="digits">00:00:00</span>
    </div>
  </div>

  <div class="section section-sw">
    <div class="label"><span class="live-dot" id="liveDot"></span>Stopwatch</div>
    <div class="sw-panel">
      <div class="sw-time" id="swTime">
        <span class="digits">00:00:00</span>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="btnToggle">시작</button>
        <button class="btn btn-secondary" id="btnReset">초기화</button>
      </div>
    </div>
  </div>

<script>
  // ============ 확대/축소 제스처 차단 ============
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
    document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
  });
  document.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 320) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // 각 문자를 fixed-width span으로 감싸서 폭 흔들림 제거
  function digitSpans(str) {
    let out = '';
    for (const c of str) {
      if (c === ':') out += `<span class="colon">${c}</span>`;
      else out += `<span class="digit">${c}</span>`;
    }
    return out;
  }

  // 컨텐츠가 부모 폭보다 넓으면 font-size를 실제로 줄여서 레이아웃 폭 = 시각 폭 유지
  // (transform:scale은 레이아웃 폭이 원본이라 아래 버튼과 정렬 어긋남)
  // 가로 모드에서 scaleX(1.05)가 걸려있으면 그만큼 여유공간을 미리 빼서 시각적 잘림 방지
  function scaleFit(el) {
    el.style.fontSize = '';
    const parent = el.parentElement;
    const isLandscape = window.matchMedia('(orientation: landscape)').matches;
    const stretchX = isLandscape ? 1.05 : 1.0;
    const avail = (parent.clientWidth * 0.98) / stretchX;
    const natural = el.scrollWidth;
    if (natural > avail && natural > 0) {
      const cur = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = (cur * (avail / natural)) + 'px';
    }
  }

  const pad2 = (n) => String(n).padStart(2, '0');

  // ============ 현재 시각 (24시간, HH:MM:SS) ============
  const clockEl = document.getElementById('clockTime');
  const clockDigits = clockEl.querySelector('.digits');
  let lastClock = '';
  function updateClock() {
    const d = new Date();
    const str = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    if (str === lastClock) return;
    lastClock = str;
    clockDigits.innerHTML = digitSpans(str);
    scaleFit(clockEl);
  }
  updateClock();
  setInterval(updateClock, 500);

  // ============ 스톱워치 (HH:MM:SS) ============
  const swEl = document.getElementById('swTime');
  const swDigits = swEl.querySelector('.digits');
  const btnToggle = document.getElementById('btnToggle');
  const btnReset = document.getElementById('btnReset');
  const liveDot = document.getElementById('liveDot');

  let running = false;
  let startedAt = 0;   // 마지막 시작 시점(ms since epoch)
  let elapsed = 0;     // 이전까지 누적된 시간(ms)
  let rafId = null;
  let lastSw = '';

  function renderSw() {
    const now = running ? (Date.now() - startedAt + elapsed) : elapsed;
    const totalSec = Math.max(0, Math.floor(now / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor(totalSec / 60) % 60;
    const s = totalSec % 60;
    const str = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    if (str === lastSw) return;
    lastSw = str;
    swDigits.innerHTML = digitSpans(str);
    scaleFit(swEl);
  }

  function tick() {
    renderSw();
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (running) return;
    running = true;
    startedAt = Date.now();
    btnToggle.textContent = '정지';
    btnToggle.classList.add('running');
    swEl.classList.add('running');
    liveDot.classList.add('on');
    btnReset.disabled = true;  // 실행 중에는 초기화 잠금 (실수 방지)
    tick();
  }

  function stop() {
    if (!running) return;
    running = false;
    elapsed += Date.now() - startedAt;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    btnToggle.textContent = '시작';
    btnToggle.classList.remove('running');
    swEl.classList.remove('running');
    liveDot.classList.remove('on');
    btnReset.disabled = false;
    renderSw();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    startedAt = 0;
    lastSw = '';
    renderSw();
  }

  btnToggle.addEventListener('click', () => {
    if (running) stop(); else start();
  });
  btnReset.addEventListener('click', reset);

  // 스페이스바 = 토글, R = 초기화 (데스크톱 편의)
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); btnToggle.click(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running) reset(); }
  });

  renderSw();

  // 방향 전환/리사이즈 시 스케일 재계산
  window.addEventListener('resize', () => {
    scaleFit(clockEl);
    scaleFit(swEl);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { scaleFit(clockEl); scaleFit(swEl); }, 100);
  });

  // ============ Wake Lock: 앱 활성 중 화면 꺼짐 방지 ============
  let wakeLock = null;
  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { /* 사용자 제스처 필요/지원 안 함 → 무시 */ }
  }
  acquireWakeLock();
  // 백그라운드→포그라운드 복귀 시 재요청 (OS가 자동 해제하기 때문)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !wakeLock) acquireWakeLock();
  });

  // ============ Service Worker ============
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
