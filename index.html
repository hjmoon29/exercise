<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="쇠질모드">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>쇠질모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #7a7a7a;
    --line: rgba(255,255,255,0.12);
    --line-strong: rgba(255,255,255,0.28);
    --panel: rgba(255,255,255,0.04);
    --accent: #fff;
    --danger: #ff4b3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    font-weight: 400;
  }
  body {
    min-height: 100dvh;
    padding-top: calc(56px + env(safe-area-inset-top));
    padding-bottom: calc(68px + env(safe-area-inset-bottom));
    padding-left: max(0px, env(safe-area-inset-left));
    padding-right: max(0px, env(safe-area-inset-right));
  }

  input, button, select, textarea {
    font-family: inherit;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
  }
  button { cursor: pointer; }

  /* ============ 상단 앱 헤더 ============ */
  .app-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(56px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    z-index: 30;
  }
  .app-icon {
    width: 26px;
    height: 26px;
    object-fit: contain;
    filter: invert(1) brightness(2);
  }
  .app-title {
    font-weight: 300;
    font-size: 17px;
    letter-spacing: 5px;
    opacity: 0.92;
  }

  /* ============ 콘텐츠 영역 ============ */
  main.content { display: block; }
  .tab-panel {
    padding: 16px 18px 24px;
    animation: fadeIn 0.18s ease-out;
  }
  .tab-panel[hidden] { display: none; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 14px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin: 18px 2px 10px;
  }
  .section-title:first-child { margin-top: 4px; }

  /* ============ GNB ============ */
  .gnb {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    z-index: 30;
  }
  .gnb-btn {
    flex: 1;
    padding: 12px 6px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--muted);
    transition: color 0.15s ease;
  }
  .gnb-btn .gnb-icon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    line-height: 1;
    letter-spacing: 1px;
  }
  .gnb-btn.active { color: var(--fg); }
  .gnb-btn.active .gnb-icon { transform: translateY(-1px); transition: transform 0.15s ease; }

  /* ============ 캘린더 (쇠일정) ============ */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 14px;
  }
  .cal-title {
    font-family: 'Anton', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    line-height: 1;
  }
  .cal-nav {
    display: flex;
    gap: 6px;
  }
  .cal-nav button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    font-size: 18px;
  }
  .cal-nav button:active { transform: scale(0.94); }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    padding: 0 2px 6px;
  }
  .cal-weekdays span {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    font-weight: 500;
  }
  .cal-weekdays span:first-child { color: #ff6a6a; }
  .cal-weekdays span:last-child { color: #6ab6ff; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    padding: 0 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 15px;
    color: var(--fg);
    position: relative;
    border: 1px solid transparent;
  }
  .cal-cell.other-month { color: rgba(255,255,255,0.18); }
  .cal-cell.today { border-color: var(--fg); font-weight: 700; }
  .cal-cell.selected { background: var(--fg); color: var(--bg); font-weight: 700; }
  .cal-cell.has-items::after {
    content: '';
    position: absolute;
    bottom: 6px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }
  .cal-cell:active { transform: scale(0.94); transition: transform 0.1s; }

  .schedule-panel {
    margin-top: 20px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
  }
  .schedule-date {
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .schedule-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .schedule-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 14px;
  }
  .schedule-item .text { flex: 1; }
  .schedule-item .del {
    color: var(--muted);
    font-size: 18px;
    padding: 0 4px;
  }
  .schedule-item .del:active { color: var(--danger); }
  .schedule-empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 12px 0;
  }
  .schedule-form {
    display: flex;
    gap: 8px;
  }
  .schedule-form input {
    flex: 1;
    padding: 12px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 14px;
  }
  .schedule-form input::placeholder { color: var(--muted); }
  .schedule-form button {
    padding: 0 18px;
    background: var(--fg);
    color: var(--bg);
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
  }

  /* ============ 기록: 상단 히어로 (날짜/시간/스톱워치가 화면 절반+) ============ */
  .workout-hero {
    min-height: 58vh;
    padding: 18px 4px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  /* 날짜/시간을 세로로 쌓아 각자 넓은 폭 확보 → 폰트 더 크게 가능 */
  .wh-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .wh-date {
    font-family: 'Anton', sans-serif;
    font-size: clamp(72px, 20vw, 120px);
    line-height: 1;
    letter-spacing: 1px;
    white-space: nowrap;
    text-align: center;
  }
  .wh-time {
    font-family: 'Anton', sans-serif;
    font-size: clamp(72px, 20vw, 120px);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: 1px;
    white-space: nowrap;
    text-align: center;
  }

  .wh-sw {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex: 1;
    width: 100%;
  }
  .wh-sw-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 14px;
    letter-spacing: 6px;
    color: var(--muted);
  }
  .wh-sw-display {
    font-family: 'Anton', sans-serif;
    font-size: clamp(130px, 34vw, 260px);  /* 크게 (JS scaleFit이 overflow 방지) */
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: var(--fg);
    white-space: nowrap;
    text-align: center;
  }
  .wh-sw-display.running { color: var(--fg); }
  .wh-sw-controls {
    display: flex;
    gap: 14px;
    margin-top: 8px;
  }
  .wh-sw-controls button {
    padding: 16px 32px;
    border: 1.5px solid var(--fg);
    border-radius: 100px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--fg);
    background: transparent;
    min-width: 116px;
  }
  .wh-sw-controls button.primary {
    background: var(--fg);
    color: var(--bg);
    font-weight: 700;
  }
  .wh-sw-controls button:active { transform: scale(0.96); }

  .exercise-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .exercise-card {
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }
  .exercise-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .exercise-name {
    font-size: 16px;
    font-weight: 700;
  }
  .exercise-head .del {
    color: var(--muted);
    font-size: 18px;
    padding: 2px 6px;
  }
  .set-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .set-chip {
    padding: 5px 10px;
    background: rgba(255,255,255,0.09);
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .set-chip .rm {
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  .set-input-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .set-input-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
  }
  .set-input-row .add-set {
    padding: 8px 14px;
    background: var(--fg);
    color: var(--bg);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }

  .add-exercise-form {
    padding: 14px;
    border: 1px dashed var(--line-strong);
    border-radius: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }
  .add-exercise-form input {
    flex: 1;
    padding: 10px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 14px;
  }
  .add-exercise-form input::placeholder { color: var(--muted); }
  .add-exercise-form button {
    padding: 10px 18px;
    background: var(--fg);
    color: var(--bg);
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
  }

  /* ============ 쇠스탯 ============ */
  .stat-card {
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    margin-bottom: 12px;
  }
  .stat-title {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .weight-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .weight-input-row input {
    flex: 1;
    padding: 12px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 20px;
    font-family: 'Anton', sans-serif;
    letter-spacing: 1px;
    text-align: center;
  }
  .weight-input-row .unit { color: var(--muted); font-size: 14px; padding: 0 4px; }
  .weight-input-row button {
    padding: 12px 18px;
    background: var(--fg);
    color: var(--bg);
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
  }

  .weight-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 4px;
    height: 90px;
    padding: 4px 2px 0;
    border-top: 1px solid var(--line);
  }
  .weight-bar {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }
  .weight-bar .bar {
    width: 100%;
    background: var(--fg);
    border-radius: 3px 3px 0 0;
    min-height: 2px;
  }
  .weight-bar .day-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .weight-bar .wt-label {
    font-size: 10px;
    font-family: 'Anton', sans-serif;
    color: var(--fg);
  }

  .rm-calc {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .rm-calc input {
    padding: 12px 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 18px;
  }
  .rm-calc .rm-out {
    padding: 10px 14px;
    background: var(--fg);
    color: var(--bg);
    border-radius: 8px;
    font-family: 'Anton', sans-serif;
    font-size: 18px;
    font-weight: 700;
    min-width: 76px;
    text-align: center;
  }
  .rm-calc .rm-out span { font-size: 11px; opacity: 0.7; }

  .big3-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .big3-row {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .big3-row .name {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .big3-row input {
    padding: 10px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 18px;
  }
  .big3-row .unit { color: var(--muted); font-size: 12px; }

  .big3-total {
    margin-top: 12px;
    padding: 14px;
    background: var(--fg);
    color: var(--bg);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .big3-total .label { font-size: 13px; letter-spacing: 3px; font-weight: 500; }
  .big3-total .value {
    font-family: 'Anton', sans-serif;
    font-size: 30px;
    line-height: 1;
    letter-spacing: 1px;
  }
  .big3-total .value small { font-size: 12px; opacity: 0.6; margin-left: 4px; }

  /* ============ 스크롤 개선 ============ */
  ::-webkit-scrollbar { width: 0; }

  /* ============ 가로 모드 (기록 탭 한정, 구버전 시계+스톱워치 뷰) ============ */
  .lm-view {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    padding: 12px 16px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vh, 24px);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .lm-section {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* 좌우 원형 버튼 자리 확보 후 남은 폭에 맞춤 */
    max-width: calc(100% - (clamp(112px, 26vh, 190px) + clamp(16px, 4vw, 48px) + 20px) * 2);
    margin: 0 auto;
  }
  .lm-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(10px, 1.8vh, 14px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: clamp(3px, 0.8vh, 8px);
  }
  .lm-time {
    font-family: 'Anton', 'Bebas Neue', 'Impact', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(96px, 36vh, 340px);
    line-height: 0.9;
    letter-spacing: 0;
    color: var(--fg);
    white-space: nowrap;
    transform: scaleX(1.05);
    transform-origin: center;
  }
  .lm-round-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: clamp(112px, 26vh, 190px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1.5px solid var(--fg);
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(15px, 2.8vh, 22px);
    letter-spacing: 2px;
    color: var(--fg);
    background: transparent;
    text-transform: uppercase;
    z-index: 101;
  }
  .lm-round-btn.lm-left { left: max(clamp(16px, 4vw, 48px), env(safe-area-inset-left)); }
  .lm-round-btn.lm-right { right: max(clamp(16px, 4vw, 48px), env(safe-area-inset-right)); }
  .lm-round-btn.primary { background: var(--fg); color: var(--bg); font-weight: 700; }
  .lm-round-btn.primary.running { background: transparent; color: var(--fg); }
  .lm-round-btn:active { transform: translateY(-50%) scale(0.96); }
  .lm-live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--fg);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .lm-live-dot.on {
    opacity: 1;
    animation: lmBlink 1s ease-in-out infinite;
  }
  @keyframes lmBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  @media (orientation: landscape) {
    /* 다른 탭들은 가로 미지원: 헤더/GNB/컨텐츠 숨기고 가로 뷰만 노출 */
    body { padding: 0 !important; }
    .app-header, .gnb, main.content { display: none !important; }
    .lm-view { display: flex; }
  }
</style>
</head>
<body>
  <header class="app-header">
    <img class="app-icon" src="icon-192.png" alt="">
    <span class="app-title">쇠질모드</span>
  </header>

  <main class="content">
    <!-- ============ TAB 1: 쇠일정 ============ -->
    <section class="tab-panel" data-tab="schedule">
      <div class="cal-header">
        <div class="cal-title" id="calTitle">2026 · 09</div>
        <div class="cal-nav">
          <button id="calPrev" aria-label="이전 달">‹</button>
          <button id="calToday" aria-label="오늘">•</button>
          <button id="calNext" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="schedule-panel">
        <div class="schedule-date" id="scheduleDate">날짜를 선택하세요</div>
        <div class="schedule-list" id="scheduleList"></div>
        <div class="schedule-form">
          <input type="text" id="scheduleInput" placeholder="일정 (예: 18:00 스쿼트)">
          <button id="scheduleAdd">추가</button>
        </div>
      </div>
    </section>

    <!-- ============ TAB 2: 기록 ============ -->
    <section class="tab-panel" data-tab="workout" hidden>
      <div class="workout-hero">
        <div class="wh-meta">
          <div class="wh-date" id="todayDate">MM.DD (요일)</div>
          <div class="wh-time" id="todayTime">00:00:00</div>
        </div>
        <div class="wh-sw">
          <div class="wh-sw-label">STOPWATCH</div>
          <div class="wh-sw-display" id="swDisplay">00:00:00</div>
          <div class="wh-sw-controls">
            <button class="primary" id="swToggle">시작</button>
            <button id="swReset">리셋</button>
          </div>
        </div>
      </div>

      <div class="section-title">오늘의 운동</div>
      <div class="exercise-list" id="exerciseList"></div>
      <div class="add-exercise-form">
        <input type="text" id="exerciseInput" placeholder="운동명 (예: 벤치프레스)">
        <button id="exerciseAdd">추가</button>
      </div>
    </section>

    <!-- ============ TAB 3: 쇠스탯 ============ -->
    <section class="tab-panel" data-tab="stats" hidden>
      <div class="section-title">몸무게</div>
      <div class="stat-card">
        <div class="weight-input-row">
          <input type="number" step="0.1" id="weightInput" placeholder="오늘 몸무게">
          <span class="unit">kg</span>
          <button id="weightSave">기록</button>
        </div>
        <div class="weight-chart" id="weightChart"></div>
      </div>

      <div class="section-title">1RM 계산기</div>
      <div class="stat-card">
        <div class="stat-title">EPLEY 공식 · 무게 × (1 + 반복/30)</div>
        <div class="rm-calc">
          <input type="number" id="rmWeight" placeholder="무게">
          <input type="number" id="rmReps" placeholder="반복">
          <div class="rm-out" id="rmOut">— <span>kg</span></div>
        </div>
      </div>

      <div class="section-title">3대 500 도전</div>
      <div class="stat-card">
        <div class="big3-list">
          <div class="big3-row">
            <span class="name">벤치</span>
            <input type="number" data-lift="bench" placeholder="1RM">
            <span class="unit">kg</span>
          </div>
          <div class="big3-row">
            <span class="name">스쿼트</span>
            <input type="number" data-lift="squat" placeholder="1RM">
            <span class="unit">kg</span>
          </div>
          <div class="big3-row">
            <span class="name">데드</span>
            <input type="number" data-lift="deadlift" placeholder="1RM">
            <span class="unit">kg</span>
          </div>
        </div>
        <div class="big3-total">
          <span class="label">TOTAL</span>
          <span class="value"><span id="big3Total">0</span><small>kg</small></span>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ 가로 모드 전용 뷰 (구버전 시계+스톱워치) ============ -->
  <div class="lm-view" aria-hidden="true">
    <section class="lm-section">
      <div class="lm-label">Now</div>
      <div class="lm-time" id="lmClock">00:00:00</div>
    </section>
    <section class="lm-section">
      <div class="lm-label"><span class="lm-live-dot" id="lmLiveDot"></span>Stopwatch</div>
      <div class="lm-time" id="lmSw">00:00:00</div>
    </section>
    <button class="lm-round-btn lm-left primary" id="lmToggle">시작</button>
    <button class="lm-round-btn lm-right" id="lmReset">리셋</button>
  </div>

  <nav class="gnb">
    <button class="gnb-btn active" data-target="schedule">
      <span class="gnb-icon">CAL</span><span>일정</span>
    </button>
    <button class="gnb-btn" data-target="workout">
      <span class="gnb-icon">LOG</span><span>기록</span>
    </button>
    <button class="gnb-btn" data-target="stats">
      <span class="gnb-icon">1RM</span><span>스탯</span>
    </button>
  </nav>

<script>
  // ============ 공통 유틸 ============
  const pad2 = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const todayKey = () => dateKey(new Date());
  const store = {
    get(k, def) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; }
    },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ============ 확대/축소 제스처 차단 ============
  ['gesturestart','gesturechange','gestureend'].forEach(evt => {
    document.addEventListener(evt, e => e.preventDefault(), { passive: false });
  });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 320) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ============ GNB / 탭 전환 ============
  const gnbBtns = document.querySelectorAll('.gnb-btn');
  const panels = document.querySelectorAll('.tab-panel');
  function switchTab(target) {
    panels.forEach(p => { p.hidden = (p.dataset.tab !== target); });
    gnbBtns.forEach(b => b.classList.toggle('active', b.dataset.target === target));
    // 기록 탭 진입 시 히어로 폰트 재적합 + Wake Lock 확보 (화면 꺼짐 방지)
    if (target === 'workout') {
      requestAnimationFrame(() => {
        if (typeof swRender === 'function') swRender();
        if (typeof renderTodayHero === 'function') renderTodayHero();
        if (window._acquireWakeLock) window._acquireWakeLock();
      });
    }
  }
  gnbBtns.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.target)));

  // ============ 1. 캘린더 (쇠일정) ============
  const KEY_SCHEDULE = 'sw_schedule_v1';
  let scheduleData = store.get(KEY_SCHEDULE, {}); // { 'YYYY-MM-DD': ['일정1','일정2'] }
  let calCursor = new Date();  calCursor.setDate(1);
  let selectedKey = todayKey();

  const calGrid = document.getElementById('calGrid');
  const calTitle = document.getElementById('calTitle');
  const scheduleDateEl = document.getElementById('scheduleDate');
  const scheduleListEl = document.getElementById('scheduleList');
  const scheduleInput = document.getElementById('scheduleInput');

  function renderCalendar() {
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    calTitle.textContent = `${y} · ${pad2(m+1)}`;
    calGrid.innerHTML = '';
    const first = new Date(y, m, 1);
    const startDay = first.getDay(); // 0=일
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrev = new Date(y, m, 0).getDate();
    const todayK = todayKey();

    // 이전 달 여백 채우기
    for (let i = startDay - 1; i >= 0; i--) {
      const d = daysInPrev - i;
      calGrid.appendChild(makeCell(d, `${y}-${pad2(m)}-${pad2(d)}`, true, todayK));
    }
    // 현재 달
    for (let d = 1; d <= daysInMonth; d++) {
      const k = `${y}-${pad2(m+1)}-${pad2(d)}`;
      calGrid.appendChild(makeCell(d, k, false, todayK));
    }
    // 다음 달 여백 채우기 (총 42칸)
    const filled = startDay + daysInMonth;
    const rest = (7 - (filled % 7)) % 7;
    for (let d = 1; d <= rest; d++) {
      const k = `${y}-${pad2(m+2)}-${pad2(d)}`;
      calGrid.appendChild(makeCell(d, k, true, todayK));
    }
    renderSchedulePanel();
  }

  function makeCell(day, key, otherMonth, todayK) {
    const el = document.createElement('div');
    el.className = 'cal-cell';
    if (otherMonth) el.classList.add('other-month');
    if (key === todayK) el.classList.add('today');
    if (key === selectedKey) el.classList.add('selected');
    if (scheduleData[key] && scheduleData[key].length) el.classList.add('has-items');
    el.textContent = day;
    el.addEventListener('click', () => {
      selectedKey = key;
      // 다른 달 클릭 시 커서 이동
      if (otherMonth) {
        const [yy, mm] = key.split('-').map(Number);
        calCursor = new Date(yy, mm - 1, 1);
      }
      renderCalendar();
    });
    return el;
  }

  function renderSchedulePanel() {
    const items = scheduleData[selectedKey] || [];
    scheduleDateEl.textContent = formatSelectedDate(selectedKey);
    scheduleListEl.innerHTML = '';
    if (items.length === 0) {
      const p = document.createElement('div');
      p.className = 'schedule-empty';
      p.textContent = '일정 없음';
      scheduleListEl.appendChild(p);
    } else {
      items.forEach((text, idx) => {
        const row = document.createElement('div');
        row.className = 'schedule-item';
        const t = document.createElement('div'); t.className = 'text'; t.textContent = text;
        const b = document.createElement('button'); b.className = 'del'; b.textContent = '×';
        b.addEventListener('click', () => {
          scheduleData[selectedKey].splice(idx, 1);
          if (scheduleData[selectedKey].length === 0) delete scheduleData[selectedKey];
          store.set(KEY_SCHEDULE, scheduleData);
          renderCalendar();
        });
        row.appendChild(t); row.appendChild(b);
        scheduleListEl.appendChild(row);
      });
    }
  }
  function formatSelectedDate(k) {
    const [y,m,d] = k.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
    return `${m}월 ${d}일 (${dow})`;
  }

  document.getElementById('calPrev').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });
  document.getElementById('calToday').addEventListener('click', () => { calCursor = new Date(); calCursor.setDate(1); selectedKey = todayKey(); renderCalendar(); });

  document.getElementById('scheduleAdd').addEventListener('click', () => addSchedule());
  scheduleInput.addEventListener('keydown', e => { if (e.key === 'Enter') addSchedule(); });
  function addSchedule() {
    const v = scheduleInput.value.trim();
    if (!v) return;
    if (!scheduleData[selectedKey]) scheduleData[selectedKey] = [];
    scheduleData[selectedKey].push(v);
    store.set(KEY_SCHEDULE, scheduleData);
    scheduleInput.value = '';
    renderCalendar();
  }

  // ============ 2. 쇠기록 (오늘 날짜/시간/스톱워치/운동) ============
  const KEY_WORKOUT = 'sw_workout_v1';
  let workoutData = store.get(KEY_WORKOUT, {});
  const todayDateEl = document.getElementById('todayDate');
  const todayTimeEl = document.getElementById('todayTime');
  const exListEl = document.getElementById('exerciseList');
  const exInput = document.getElementById('exerciseInput');

  const lmClockEl = document.getElementById('lmClock');
  function renderTodayHero() {
    const d = new Date();
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    todayDateEl.textContent = `${pad2(d.getMonth()+1)}.${pad2(d.getDate())} (${dow})`;
    const t = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    todayTimeEl.textContent = t;
    if (lmClockEl) lmClockEl.textContent = t;
  }
  setInterval(renderTodayHero, 1000);
  renderTodayHero();

  function renderExercises() {
    const list = workoutData[todayKey()] || [];
    exListEl.innerHTML = '';
    list.forEach((ex, idx) => {
      const card = document.createElement('div');
      card.className = 'exercise-card';
      const head = document.createElement('div'); head.className = 'exercise-head';
      const nm = document.createElement('div'); nm.className = 'exercise-name'; nm.textContent = ex.name;
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
      del.addEventListener('click', () => {
        workoutData[todayKey()].splice(idx, 1);
        if (workoutData[todayKey()].length === 0) delete workoutData[todayKey()];
        store.set(KEY_WORKOUT, workoutData);
        renderExercises();
      });
      head.appendChild(nm); head.appendChild(del); card.appendChild(head);

      const chips = document.createElement('div'); chips.className = 'set-list';
      (ex.sets || []).forEach((s, si) => {
        const c = document.createElement('span'); c.className = 'set-chip';
        c.innerHTML = `${s.weight}<span class="rm">×</span>${s.reps}`;
        const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×';
        rm.addEventListener('click', () => {
          ex.sets.splice(si, 1);
          store.set(KEY_WORKOUT, workoutData);
          renderExercises();
        });
        c.appendChild(rm);
        chips.appendChild(c);
      });
      card.appendChild(chips);

      const inputRow = document.createElement('div'); inputRow.className = 'set-input-row';
      const wIn = Object.assign(document.createElement('input'), { type: 'number', placeholder: '무게(kg)', step: '0.5' });
      const rIn = Object.assign(document.createElement('input'), { type: 'number', placeholder: '반복', step: '1' });
      const add = document.createElement('button'); add.className = 'add-set'; add.textContent = '세트 +';
      add.addEventListener('click', () => {
        const w = parseFloat(wIn.value), r = parseInt(rIn.value);
        if (isNaN(w) || isNaN(r) || w <= 0 || r <= 0) return;
        if (!ex.sets) ex.sets = [];
        ex.sets.push({ weight: w, reps: r });
        store.set(KEY_WORKOUT, workoutData);
        wIn.value = ''; rIn.value = '';
        renderExercises();
      });
      inputRow.appendChild(wIn); inputRow.appendChild(rIn); inputRow.appendChild(add);
      card.appendChild(inputRow);

      exListEl.appendChild(card);
    });
  }

  document.getElementById('exerciseAdd').addEventListener('click', () => {
    const v = exInput.value.trim();
    if (!v) return;
    const k = todayKey();
    if (!workoutData[k]) workoutData[k] = [];
    workoutData[k].push({ name: v, sets: [] });
    store.set(KEY_WORKOUT, workoutData);
    exInput.value = '';
    renderExercises();
  });
  exInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('exerciseAdd').click(); });
  renderExercises();

  // ============ 스톱워치 (세로 wh-sw-display + 가로 lm-sw 동시 업데이트) ============
  const swDisplay = document.getElementById('swDisplay');
  const swToggle = document.getElementById('swToggle');
  const swReset = document.getElementById('swReset');
  const lmSw = document.getElementById('lmSw');
  const lmToggle = document.getElementById('lmToggle');
  const lmReset = document.getElementById('lmReset');
  const lmLiveDot = document.getElementById('lmLiveDot');
  let swRunning = false, swStart = 0, swElapsed = 0, swRaf = null;
  function swRender() {
    const now = swRunning ? (Date.now() - swStart + swElapsed) : swElapsed;
    const total = Math.max(0, Math.floor(now / 1000));
    const h = Math.floor(total/3600), m = Math.floor(total/60)%60, s = total%60;
    const str = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    swDisplay.textContent = str;
    if (lmSw) lmSw.textContent = str;
  }
  function swTick() { swRender(); swRaf = requestAnimationFrame(swTick); }
  function swStartFn() {
    if (swRunning) return;
    swRunning = true;
    swStart = Date.now();
    swToggle.textContent = '정지';
    swDisplay.classList.add('running');
    if (lmToggle) { lmToggle.textContent = '정지'; lmToggle.classList.add('running'); }
    if (lmLiveDot) lmLiveDot.classList.add('on');
    swTick();
  }
  function swStopFn() {
    if (!swRunning) return;
    swRunning = false;
    swElapsed += Date.now() - swStart;
    if (swRaf) cancelAnimationFrame(swRaf);
    swRaf = null;
    swToggle.textContent = '시작';
    swDisplay.classList.remove('running');
    if (lmToggle) { lmToggle.textContent = '시작'; lmToggle.classList.remove('running'); }
    if (lmLiveDot) lmLiveDot.classList.remove('on');
    swRender();
  }
  function swResetFn() {
    if (swRunning) return;
    swElapsed = 0; swStart = 0; swRender();
  }
  swToggle.addEventListener('click', () => swRunning ? swStopFn() : swStartFn());
  swReset.addEventListener('click', swResetFn);
  if (lmToggle) lmToggle.addEventListener('click', () => swRunning ? swStopFn() : swStartFn());
  if (lmReset) lmReset.addEventListener('click', swResetFn);

  // 세로 히어로 텍스트가 폭을 넘어서면 자동으로 폰트 축소 (overflow 방지)
  function fitToWidth(el, ratio = 0.98) {
    if (!el || !el.offsetParent) return;
    el.style.fontSize = '';
    const parent = el.parentElement;
    if (!parent) return;
    const avail = parent.clientWidth * ratio;
    const natural = el.scrollWidth;
    if (natural > avail && natural > 0) {
      const cur = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = (cur * (avail / natural)) + 'px';
    }
  }
  function fitHero() {
    fitToWidth(todayDateEl);
    fitToWidth(todayTimeEl);
    fitToWidth(swDisplay);
  }
  const _origSwRender = swRender;
  swRender = function() { _origSwRender(); fitToWidth(swDisplay); };
  const _origRenderTodayHero = renderTodayHero;
  renderTodayHero = function() { _origRenderTodayHero(); fitToWidth(todayDateEl); fitToWidth(todayTimeEl); };
  window.addEventListener('resize', fitHero);
  window.addEventListener('orientationchange', () => setTimeout(fitHero, 120));
  swRender();

  // ============ 3. 쇠스탯 ============
  const KEY_WT = 'sw_bodyweight_v1';
  const KEY_1RM = 'sw_1rm_v1';
  let wtData = store.get(KEY_WT, {}); // { 'YYYY-MM-DD': kg }
  let big3Data = store.get(KEY_1RM, { bench: 0, squat: 0, deadlift: 0 });

  const weightInput = document.getElementById('weightInput');
  const weightChart = document.getElementById('weightChart');
  document.getElementById('weightSave').addEventListener('click', () => {
    const v = parseFloat(weightInput.value);
    if (isNaN(v) || v <= 0) return;
    wtData[todayKey()] = v;
    store.set(KEY_WT, wtData);
    weightInput.value = '';
    renderWeightChart();
  });

  function renderWeightChart() {
    weightChart.innerHTML = '';
    const days = 7;
    const now = new Date();
    const values = [];
    const labels = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      const k = dateKey(d);
      values.push(wtData[k] || null);
      labels.push(pad2(d.getDate()));
    }
    const nums = values.filter(v => v != null);
    const min = nums.length ? Math.min(...nums) : 0;
    const max = nums.length ? Math.max(...nums) : 0;
    const range = Math.max(1, max - min);
    for (let i = 0; i < days; i++) {
      const bar = document.createElement('div'); bar.className = 'weight-bar';
      const b = document.createElement('div'); b.className = 'bar';
      const v = values[i];
      if (v == null) {
        b.style.height = '2px'; b.style.opacity = '0.15';
      } else {
        const pct = nums.length > 1 ? ((v - min) / range) * 78 + 12 : 60;
        b.style.height = pct + '%';
      }
      const wt = document.createElement('div'); wt.className = 'wt-label';
      wt.textContent = v != null ? v.toFixed(1) : '';
      const dl = document.createElement('div'); dl.className = 'day-label'; dl.textContent = labels[i];
      bar.appendChild(wt); bar.appendChild(b); bar.appendChild(dl);
      weightChart.appendChild(bar);
    }
  }
  renderWeightChart();

  // 1RM 계산기
  const rmWeight = document.getElementById('rmWeight');
  const rmReps = document.getElementById('rmReps');
  const rmOut = document.getElementById('rmOut');
  function calc1RM() {
    const w = parseFloat(rmWeight.value), r = parseInt(rmReps.value);
    if (isNaN(w) || isNaN(r) || w <= 0 || r <= 0) { rmOut.innerHTML = '— <span>kg</span>'; return; }
    const rm = w * (1 + r/30);
    rmOut.innerHTML = `${rm.toFixed(1)} <span>kg</span>`;
  }
  rmWeight.addEventListener('input', calc1RM);
  rmReps.addEventListener('input', calc1RM);

  // 3대 총합
  const big3Inputs = document.querySelectorAll('input[data-lift]');
  const big3TotalEl = document.getElementById('big3Total');
  function renderBig3() {
    big3Inputs.forEach(inp => {
      const v = big3Data[inp.dataset.lift];
      inp.value = v > 0 ? v : '';
    });
    const total = (big3Data.bench||0) + (big3Data.squat||0) + (big3Data.deadlift||0);
    big3TotalEl.textContent = total;
  }
  big3Inputs.forEach(inp => {
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value) || 0;
      big3Data[inp.dataset.lift] = v;
      store.set(KEY_1RM, big3Data);
      const total = (big3Data.bench||0) + (big3Data.squat||0) + (big3Data.deadlift||0);
      big3TotalEl.textContent = total;
    });
  });
  renderBig3();

  // ============ Wake Lock (기록 탭·스톱워치 사용 중 화면 꺼짐 방지) ============
  let wakeLock = null;
  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    if (wakeLock) return; // 중복 요청 방지
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch { /* NotAllowedError 등 무시 */ }
  }
  async function releaseWakeLock() {
    if (!wakeLock) return;
    try { await wakeLock.release(); } catch {}
    wakeLock = null;
  }
  // 초기 시도 (제스처 없어 실패할 수 있음)
  acquireWakeLock();
  // 사용자 첫 탭/클릭 시 확실히 재요청
  document.addEventListener('click', () => acquireWakeLock(), { once: false });
  // 백그라운드 복귀 시 재요청
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') acquireWakeLock();
  });
  // 스톱워치 시작 시에도 명시적으로 확보
  const _origSwStart = swStartFn;
  swStartFn = function() { _origSwStart(); acquireWakeLock(); };
  // switchTab에서 기록 탭 진입 시 wake lock 확보 (아래에서 참조)
  window._acquireWakeLock = acquireWakeLock;

  // ============ 초기 ============
  renderCalendar();

  // ============ Service Worker ============
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
