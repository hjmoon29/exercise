<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="쇠질모드">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>쇠질모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;                              /* 딥 네이비 블랙 (살짝 푸른 끼) */
    --fg: #eef3fa;                              /* 쿨 화이트 */
    --muted: #7a8599;                           /* 쿨 그레이 */
    --line: rgba(170, 200, 240, 0.14);
    --line-strong: rgba(170, 200, 240, 0.32);
    --panel: rgba(130, 170, 230, 0.05);
    --accent: #7fb0ff;                          /* 스틸 블루 액센트 (스톱워치/running) */
    --accent-dim: rgba(127, 176, 255, 0.22);
    --danger: #ef4444;                          /* 레드 */
    /* 탭별 테마 컬러 */
    --c-schedule: #4ade80;                      /* 에메랄드 그린 (일정) */
    --c-schedule-dim: rgba(74, 222, 128, 0.22);
    --c-schedule-glow: rgba(74, 222, 128, 0.35);
    --c-workout: #fb923c;                       /* 바이브런트 오렌지 (기록) */
    --c-workout-dim: rgba(251, 146, 60, 0.22);
    --c-workout-glow: rgba(251, 146, 60, 0.35);
    --c-stats: #c084fc;                         /* 퍼플 (스탯) */
    --c-stats-dim: rgba(192, 132, 252, 0.22);
    --c-stats-glow: rgba(192, 132, 252, 0.35);
    --c-stats-alt: #f0abfc;                     /* 퍼플 그라데이션 보조 */
    --c-info: #7fb0ff;                          /* 블루 (정보/running) */
    --c-plan: #facc15;                          /* 앰버 (루틴) */
    --c-plan-dim: rgba(250, 204, 21, 0.22);
    --c-plan-glow: rgba(250, 204, 21, 0.35);
    --c-timer: #22d3ee;                         /* 사이안 (타이머) */
    --c-timer-dim: rgba(34, 211, 238, 0.22);
    --c-timer-glow: rgba(34, 211, 238, 0.35);
    --c-timer-alert: #ef4444;                   /* 타이머 종료 알림 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    font-weight: 400;
    overflow-x: hidden;
  }
  body {
    min-height: 100dvh;
    padding-top: calc(56px + env(safe-area-inset-top));
    padding-bottom: calc(68px + env(safe-area-inset-bottom));
    padding-left: max(0px, env(safe-area-inset-left));
    padding-right: max(0px, env(safe-area-inset-right));
  }

  input, button, select, textarea {
    font-family: inherit;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
  }
  button { cursor: pointer; }

  /* ============ 상단 앱 헤더 ============ */
  .app-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(56px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    z-index: 30;
  }
  .app-icon {
    width: 26px;
    height: 26px;
    object-fit: contain;
    filter: invert(1) brightness(2);
  }
  .app-title {
    font-weight: 300;
    font-size: 17px;
    letter-spacing: 5px;
    opacity: 0.92;
  }

  /* ============ 콘텐츠 영역 ============ */
  main.content { display: block; }
  .tab-panel {
    padding: 12px 16px 18px;
    animation: fadeIn 0.18s ease-out;
    overflow-x: hidden;
  }
  .tab-panel[hidden] { display: none; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin: 12px 2px 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .section-title:first-child { margin-top: 2px; }
  .section-title::before {
    content: '';
    width: 3px;
    height: 11px;
    background: var(--fg);
    border-radius: 2px;
  }
  /* 탭별 섹션 타이틀 bar 색상 */
  [data-tab="workout"] .section-title::before { background: var(--c-workout); box-shadow: 0 0 8px var(--c-workout-glow); }
  [data-tab="workout"] .section-title { color: var(--c-workout); opacity: 0.85; }
  [data-tab="stats"] .section-title::before { background: var(--c-stats); box-shadow: 0 0 8px var(--c-stats-glow); }
  [data-tab="stats"] .section-title { color: var(--c-stats); opacity: 0.85; }
  [data-tab="plan"] .section-title::before { background: var(--c-plan); box-shadow: 0 0 8px var(--c-plan-glow); }
  [data-tab="plan"] .section-title { color: var(--c-plan); opacity: 0.85; }
  [data-tab="timer"] .section-title::before { background: var(--c-timer); box-shadow: 0 0 8px var(--c-timer-glow); }
  [data-tab="timer"] .section-title { color: var(--c-timer); opacity: 0.85; }

  /* ============ GNB ============ */
  .gnb {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    z-index: 30;
  }
  .gnb-btn {
    flex: 1;
    padding: 12px 6px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--muted);
    transition: color 0.18s ease;
    position: relative;
  }
  .gnb-btn .gnb-icon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    line-height: 1;
    letter-spacing: 1px;
  }
  /* 테마 컬러별 활성 상태 */
  .gnb-btn[data-target="schedule"].active { color: var(--c-schedule); }
  .gnb-btn[data-target="plan"].active { color: var(--c-plan); }
  .gnb-btn[data-target="workout"].active { color: var(--c-workout); }
  .gnb-btn[data-target="timer"].active { color: var(--c-timer); }
  .gnb-btn[data-target="stats"].active { color: var(--c-stats); }
  .gnb-btn.active .gnb-icon {
    transform: translateY(-1px);
    transition: transform 0.18s ease;
    text-shadow: 0 0 10px currentColor;
  }
  /* 상단 인디케이터 (활성 탭 위 글로우 바) */
  .gnb-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 32px; height: 2px;
    border-radius: 0 0 2px 2px;
    background: currentColor;
    opacity: 0;
    transition: opacity 0.18s ease, width 0.18s ease;
    box-shadow: 0 0 12px currentColor;
  }
  .gnb-btn.active::before { opacity: 1; width: 44px; }

  /* ============ 캘린더 (쇠일정) ============ */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 14px;
  }
  .cal-title {
    font-family: 'Anton', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    line-height: 1;
    background: linear-gradient(135deg, var(--fg) 0%, var(--c-schedule) 180%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cal-nav {
    display: flex;
    gap: 6px;
  }
  .cal-nav button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    font-size: 18px;
    transition: all 0.15s ease;
  }
  .cal-nav button#calToday {
    color: var(--c-schedule);
    border-color: var(--c-schedule-dim);
  }
  .cal-nav button#calToday:active { background: var(--c-schedule-dim); }
  .cal-nav button:active { transform: scale(0.94); }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    padding: 0 2px 6px;
  }
  .cal-weekdays span {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    font-weight: 500;
  }
  .cal-weekdays span:first-child { color: #ff6a6a; }
  .cal-weekdays span:last-child { color: #6ab6ff; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    padding: 0 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 15px;
    color: var(--fg);
    position: relative;
    border: 1px solid transparent;
  }
  .cal-cell.other-month { color: rgba(255,255,255,0.18); }
  .cal-cell.today {
    border-color: var(--c-schedule);
    color: var(--c-schedule);
    font-weight: 700;
    box-shadow: inset 0 0 12px var(--c-schedule-dim);
  }
  .cal-cell.selected {
    background: linear-gradient(135deg, var(--c-schedule) 0%, #22c55e 100%);
    color: var(--bg);
    font-weight: 700;
    box-shadow: 0 4px 12px var(--c-schedule-glow);
  }
  .cal-cell.selected.today { border-color: transparent; }
  .cal-cell.has-items::after {
    content: '';
    position: absolute;
    bottom: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--c-schedule);
    box-shadow: 0 0 6px var(--c-schedule-glow);
  }
  .cal-cell.selected.has-items::after { background: var(--bg); box-shadow: none; }
  .cal-cell:active { transform: scale(0.94); transition: transform 0.1s; }

  .schedule-panel {
    margin-top: 20px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    position: relative;
    overflow: hidden;
  }
  .schedule-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--c-schedule) 0%, transparent 100%);
  }
  .schedule-date {
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    color: var(--c-schedule);
  }
  .schedule-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .schedule-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(74, 222, 128, 0.08);
    border-left: 2px solid var(--c-schedule);
    border-radius: 8px;
    font-size: 14px;
  }
  .schedule-item .text { flex: 1; }
  .schedule-item .del {
    color: var(--muted);
    font-size: 18px;
    padding: 0 4px;
  }
  .schedule-item .del:active { color: var(--danger); }
  .schedule-empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 12px 0;
  }
  .schedule-form {
    display: flex;
    gap: 8px;
  }
  .schedule-form input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 14px;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .schedule-form input:focus { border-color: var(--c-schedule-dim); }
  .schedule-form input::placeholder { color: var(--muted); }
  .schedule-form button {
    padding: 0 18px;
    background: linear-gradient(135deg, var(--c-schedule) 0%, #22c55e 100%);
    color: var(--bg);
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 12px var(--c-schedule-dim);
  }
  .schedule-form button:active { transform: scale(0.96); }

  /* ============ 기록: 상단 히어로 (날짜/시간/스톱워치) ============ */
  .workout-hero {
    padding: 10px 4px 14px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  /* 날짜(2줄 스택)와 시간(1줄)을 한 행에, 세로 중앙 정렬 */
  .wh-meta {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 4px;
    width: 100%;
    overflow: hidden;
  }
  /* 날짜: MM.DD 위 + 요일 아래 스택. 우측 시간 폰트 높이와 시각적으로 매칭 */
  .wh-date {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    line-height: 1;
    white-space: nowrap;
    min-width: 0;
    flex-shrink: 0;
  }
  .wh-date-main {
    font-family: 'Anton', sans-serif;
    font-size: clamp(24px, 8vw, 48px);
    line-height: 1;
    letter-spacing: 1px;
  }
  .wh-date-sub {
    font-family: 'Anton', sans-serif;
    font-size: clamp(16px, 5.5vw, 32px);
    line-height: 1;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .wh-time {
    font-family: 'Anton', sans-serif;
    font-size: clamp(50px, 17vw, 104px);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: 1px;
    white-space: nowrap;
    min-width: 0;
    flex-shrink: 1;
  }
  /* 자릿수 폭 고정: 1/8 등 어떤 숫자든 동일 슬롯 (Anton은 tabular-nums 미지원) */
  .wh-time .digit,
  .wh-sw-display .digit,
  .lm-time .digit {
    display: inline-block;
    width: 0.58em;
    text-align: center;
    overflow: hidden;      /* 슬롯보다 큰 글자가 있어도 scrollWidth 계산 안정화 */
  }
  .wh-time .colon,
  .wh-sw-display .colon,
  .lm-time .colon {
    display: inline-block;
    width: 0.24em;
    text-align: center;
    overflow: hidden;
  }

  .wh-sw {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }
  .wh-sw-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--c-workout);
    opacity: 0.8;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .wh-sw-label::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--c-workout);
    box-shadow: 0 0 8px var(--c-workout-glow);
  }
  .wh-sw-display {
    font-family: 'Anton', sans-serif;
    font-size: clamp(96px, 26vw, 196px);
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: var(--fg);
    white-space: nowrap;
    text-align: center;
  }
  .wh-sw-display.running { color: var(--accent); }
  .wh-sw-controls {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }
  .wh-sw-controls button {
    padding: 11px 24px;
    border: 1.5px solid var(--fg);
    border-radius: 100px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--fg);
    background: transparent;
    min-width: 100px;
  }
  .wh-sw-controls button.primary {
    background: var(--fg);
    color: var(--bg);
    font-weight: 700;
  }
  .wh-sw-controls button:active { transform: scale(0.96); }

  .exercise-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .exercise-card {
    padding: 14px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--c-workout);
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(251,146,60,0.06) 0%, var(--panel) 60%);
    box-shadow: 0 2px 10px rgba(251,146,60,0.04);
  }
  .exercise-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .exercise-name {
    font-size: 16px;
    font-weight: 700;
  }
  .exercise-head .del {
    color: var(--muted);
    font-size: 18px;
    padding: 2px 6px;
  }
  .exercise-head .del:active { color: var(--danger); }
  .set-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .set-chip {
    padding: 5px 10px;
    background: var(--c-workout-dim);
    color: var(--c-workout);
    border: 1px solid rgba(251,146,60,0.3);
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  .set-chip .rm {
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  .set-input-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .set-input-row input {
    flex: 1;
    min-width: 0;
    width: 100%;
    padding: 8px 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .set-input-row input:focus { border-color: var(--c-workout-dim); }
  .set-input-row .add-set {
    padding: 8px 14px;
    background: linear-gradient(135deg, var(--c-workout) 0%, #f97316 100%);
    color: var(--bg);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 2px 8px var(--c-workout-dim);
  }
  .set-input-row .add-set:active { transform: scale(0.96); }

  .add-exercise-form {
    padding: 10px;
    border: 1px dashed var(--c-workout-dim);
    border-radius: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
  }
  .add-exercise-form input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 14px;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .add-exercise-form input:focus { border-color: var(--c-workout-dim); }
  .add-exercise-form input::placeholder { color: var(--muted); }
  .add-exercise-form button {
    padding: 10px 18px;
    background: linear-gradient(135deg, var(--c-workout) 0%, #f97316 100%);
    color: var(--bg);
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 12px var(--c-workout-dim);
  }
  .add-exercise-form button:active { transform: scale(0.96); }

  /* ============ 쇠스탯 ============ */
  .stat-card {
    padding: 16px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--c-stats);
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(192,132,252,0.05) 0%, var(--panel) 60%);
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(192,132,252,0.04);
  }
  .stat-title {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--c-stats);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.85;
  }
  .weight-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    min-width: 0;
  }
  .weight-input-row input {
    flex: 1;
    min-width: 0;
    padding: 12px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 18px;
    font-family: 'Anton', sans-serif;
    letter-spacing: 1px;
    text-align: center;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .weight-input-row input:focus { border-color: var(--c-stats-dim); }
  .weight-input-row .unit { color: var(--muted); font-size: 13px; padding: 0 2px; flex-shrink: 0; }
  .weight-input-row button {
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--c-stats) 0%, #a855f7 100%);

    flex-shrink: 0;

  .weight-chart {

  .weight-bar .bar {

    box-shadow: 0 -2px 8px var(--c-stats-dim);

    font-family: 'Anton', sans-serif;

  .rm-calc {

    gap: 6px;
    align-items: center;
    margin-bottom: 14px;

  }
  .rm-calc input {
    min-width: 0;
    padding: 11px 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;

    font-family: 'Anton', sans-serif;
    font-size: 16px;
    border: 1px solid transparent;

  }
  .rm-calc input:focus { border-color: var(--c-stats-dim); }
  .rm-calc .rm-out {
    padding: 10px 10px;
    background: linear-gradient(135deg, var(--c-stats) 0%, #a855f7 100%);

    font-family: 'Anton', sans-serif;
    font-size: 16px;
    font-weight: 700;

  .big3-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .big3-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 10px;
    align-items: center;
    min-width: 0;
  }
  .big3-row .name {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--c-stats);
    opacity: 0.85;
    font-weight: 600;
  }
  .big3-row input {
    min-width: 0;
    padding: 10px 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 17px;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .big3-row input:focus { border-color: var(--c-stats-dim); }
  .big3-row .unit { color: var(--muted); font-size: 12px; }

  .big3-total {
    margin-top: 12px;
    padding: 14px;
    background: linear-gradient(135deg, var(--c-stats) 0%, #a855f7 60%, var(--c-info) 100%);
    color: var(--bg);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
    box-shadow: 0 8px 24px rgba(192,132,252,0.25);
    position: relative;
    overflow: hidden;
  }
  .big3-total::before {
    content: '';
    position: absolute;
    top: -40%; right: -20%;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .big3-total .label { font-size: 13px; letter-spacing: 3px; font-weight: 500; flex-shrink: 0; position: relative; }
  .big3-total .value {
    font-family: 'Anton', sans-serif;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 1px;
    min-width: 0;
    white-space: nowrap;
    position: relative;
  }
  .big3-total .value small { font-size: 12px; opacity: 0.7; margin-left: 4px; }

  /* ============ 쇠루틴 (PLAN) ============ */
  .routine-card {
    padding: 14px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--c-plan);
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(250,204,21,0.06) 0%, var(--panel) 60%);
    margin-bottom: 10px;
    box-shadow: 0 2px 10px rgba(250,204,21,0.04);
  }
  .routine-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
  }
  .routine-name {
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--fg);
    flex: 1;
    min-width: 0;
  }
  .routine-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--c-plan);
    background: var(--c-plan-dim);
    border-radius: 999px;
    padding: 3px 8px;
  }
  .routine-head .del {
    color: var(--muted);
    font-size: 18px;
    padding: 2px 6px;
  }
  .routine-head .del:active { color: var(--danger); }
  .routine-exercises {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .routine-ex-chip {
    padding: 5px 10px;
    background: rgba(250,204,21,0.1);
    color: var(--c-plan);
    border: 1px solid rgba(250,204,21,0.25);
    border-radius: 999px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  .routine-ex-chip .rm {
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
  }
  .routine-empty-ex {
    color: var(--muted);
    font-size: 12px;
    padding: 4px 0;
  }
  .routine-add-ex {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .routine-add-ex input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .routine-add-ex input:focus { border-color: var(--c-plan-dim); }
  .routine-add-ex button {
    padding: 8px 14px;
    background: rgba(250,204,21,0.15);
    color: var(--c-plan);
    border: 1px solid var(--c-plan-dim);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .routine-apply {
    width: 100%;
    padding: 11px;
    background: linear-gradient(135deg, var(--c-plan) 0%, #eab308 100%);
    color: var(--bg);
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    box-shadow: 0 4px 12px var(--c-plan-dim);
  }
  .routine-apply:active { transform: scale(0.97); }

  .routine-create-form {
    padding: 10px;
    border: 1px dashed var(--c-plan-dim);
    border-radius: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
  }
  .routine-create-form input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 14px;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .routine-create-form input:focus { border-color: var(--c-plan-dim); }
  .routine-create-form input::placeholder { color: var(--muted); }
  .routine-create-form button {
    padding: 10px 18px;
    background: linear-gradient(135deg, var(--c-plan) 0%, #eab308 100%);
    color: var(--bg);
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 12px var(--c-plan-dim);
  }
  .routine-create-form button:active { transform: scale(0.96); }

  /* ============ 쇠타이머 (REST) ============ */
  .timer-hero {
    padding: 20px 4px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .timer-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--c-timer);
    opacity: 0.85;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .timer-label::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--c-timer);
    box-shadow: 0 0 8px var(--c-timer-glow);
  }
  .timer-display {
    font-family: 'Anton', sans-serif;
    font-size: clamp(96px, 28vw, 220px);
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: var(--fg);
    white-space: nowrap;
    transition: color 0.2s ease, transform 0.1s ease;
  }
  .timer-display .digit {
    display: inline-block;
    width: 0.58em;
    text-align: center;
    overflow: hidden;
  }
  .timer-display .colon {
    display: inline-block;
    width: 0.24em;
    text-align: center;
    overflow: hidden;
  }
  .timer-display.running { color: var(--c-timer); }
  .timer-display.alert {
    color: var(--c-timer-alert);
    animation: timerAlert 0.5s ease-in-out infinite;
  }
  @keyframes timerAlert {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.75; }
  }

  .timer-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .timer-controls button {
    padding: 11px 22px;
    border: 1.5px solid var(--c-timer);
    border-radius: 100px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--c-timer);
    background: transparent;
    min-width: 90px;
  }
  .timer-controls button.primary {
    background: linear-gradient(135deg, var(--c-timer) 0%, #06b6d4 100%);
    color: var(--bg);
    font-weight: 700;
    border-color: transparent;
    box-shadow: 0 4px 14px var(--c-timer-dim);
  }
  .timer-controls button:active { transform: scale(0.96); }
  .timer-adjust { display: flex; gap: 8px; justify-content: center; }
  .timer-adjust button {
    padding: 8px 14px;
    background: rgba(34, 211, 238, 0.1);
    color: var(--c-timer);
    border: 1px solid var(--c-timer-dim);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .timer-presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .timer-preset {
    padding: 14px 4px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: 'Anton', sans-serif;
    font-size: 18px;
    color: var(--fg);
    letter-spacing: 1px;
    text-align: center;
    transition: all 0.15s ease;
  }
  .timer-preset small {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 2px;
  }
  .timer-preset:active {
    background: var(--c-timer-dim);
    border-color: var(--c-timer);
    color: var(--c-timer);
    transform: scale(0.96);
  }
  .timer-preset.active {
    background: var(--c-timer-dim);
    border-color: var(--c-timer);
    color: var(--c-timer);
    box-shadow: 0 0 12px var(--c-timer-dim);
  }

  .timer-custom {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .timer-custom input {
    flex: 1;
    min-width: 0;
    padding: 11px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 16px;
    font-family: 'Anton', sans-serif;
    letter-spacing: 1px;
    text-align: center;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .timer-custom input:focus { border-color: var(--c-timer-dim); }
  .timer-custom .unit { color: var(--muted); font-size: 13px; padding: 0 2px; flex-shrink: 0; }
  .timer-custom button {
    padding: 11px 18px;
    background: linear-gradient(135deg, var(--c-timer) 0%, #06b6d4 100%);
    color: var(--bg);
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 4px 12px var(--c-timer-dim);
    flex-shrink: 0;
  }

  /* ============ 스크롤 개선 ============ */
  ::-webkit-scrollbar { width: 0; }

  /* ============ 가로 모드 (기록 탭 한정, 구버전 시계+스톱워치 뷰) ============ */
  .lm-view {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    padding: 12px 16px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vh, 24px);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .lm-section {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* 좌우 원형 버튼 자리 확보 후 남은 폭에 맞춤 */
    max-width: calc(100% - (clamp(112px, 26vh, 190px) + clamp(16px, 4vw, 48px) + 20px) * 2);
    margin: 0 auto;
  }
  .lm-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(10px, 1.8vh, 14px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: clamp(3px, 0.8vh, 8px);
  }
  .lm-time {
    font-family: 'Anton', 'Bebas Neue', 'Impact', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(96px, 36vh, 340px);
    line-height: 0.9;
    letter-spacing: 0;
    color: var(--fg);
    white-space: nowrap;
    transform: scaleX(1.05);
    transform-origin: center;
  }
  /* 가로 모드 현재 시각(Now)은 세로 wh-time과 동일한 muted 회색 처리 */
  #lmClock { color: var(--muted); }
  /* 가로 모드 스톱워치 러닝 시 세로 모드와 동일하게 블루 액센트 */
  #lmSw.running { color: var(--accent); }
  .lm-round-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: clamp(112px, 26vh, 190px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1.5px solid var(--fg);
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(15px, 2.8vh, 22px);
    letter-spacing: 2px;
    color: var(--fg);
    background: transparent;
    text-transform: uppercase;
    z-index: 101;
  }
  .lm-round-btn.lm-left { left: max(clamp(16px, 4vw, 48px), env(safe-area-inset-left)); }
  .lm-round-btn.lm-right { right: max(clamp(16px, 4vw, 48px), env(safe-area-inset-right)); }
  .lm-round-btn.primary { background: var(--fg); color: var(--bg); font-weight: 700; }
  .lm-round-btn.primary.running { background: transparent; color: var(--accent); border-color: var(--accent); }
  .lm-round-btn:active { transform: translateY(-50%) scale(0.96); }
  .lm-live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.2s;
    box-shadow: 0 0 8px var(--accent-dim);
  }
  .lm-live-dot.on {
    opacity: 1;
    animation: lmBlink 1s ease-in-out infinite;
  }
  @keyframes lmBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  @media (orientation: landscape) {
    /* 다른 탭들은 가로 미지원: 헤더/GNB/컨텐츠 숨기고 가로 뷰만 노출 */
    body { padding: 0 !important; }
    .app-header, .gnb, main.content { display: none !important; }
    .lm-view { display: flex; }
  }
</style>
</head>
<body>
  <header class="app-header">
    <img class="app-icon" src="icon-192.png" alt="">
    <span class="app-title">쇠질모드</span>
  </header>

  <main class="content">
    <!-- ============ TAB 1: 쇠일정 ============ -->
    <section class="tab-panel" data-tab="schedule">
      <div class="cal-header">
        <div class="cal-title" id="calTitle">2026 · 09</div>
        <div class="cal-nav">
          <button id="calPrev" aria-label="이전 달">‹</button>
          <button id="calToday" aria-label="오늘">•</button>
          <button id="calNext" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="schedule-panel">
        <div class="schedule-date" id="scheduleDate">날짜를 선택하세요</div>
        <div class="schedule-list" id="scheduleList"></div>
        <div class="schedule-form">
          <input type="text" id="scheduleInput" placeholder="일정 (예: 18:00 스쿼트)">
          <button id="scheduleAdd">추가</button>
        </div>
      </div>
    </section>

    <!-- ============ TAB: 쇠루틴 ============ -->
    <section class="tab-panel" data-tab="plan" hidden>
      <div class="section-title">내 루틴</div>
      <div id="routineList"></div>
      <div class="section-title">새 루틴 만들기</div>
      <div class="routine-create-form">
        <input type="text" id="routineNameInput" placeholder="루틴 이름 (예: 가슴 + 삼두)">
        <button id="routineCreate">생성</button>
      </div>
    </section>

    <!-- ============ TAB 2: 기록 ============ -->
    <section class="tab-panel" data-tab="workout" hidden>
      <div class="workout-hero">
        <div class="wh-meta">
          <div class="wh-date" id="todayDate">
            <span class="wh-date-main">MM.DD</span>
            <span class="wh-date-sub">요일</span>
          </div>
          <div class="wh-time" id="todayTime">00:00:00</div>
        </div>
        <div class="wh-sw">
          <div class="wh-sw-label">STOPWATCH</div>
          <div class="wh-sw-display" id="swDisplay">00:00:00</div>
          <div class="wh-sw-controls">
            <button class="primary" id="swToggle">시작</button>
            <button id="swReset">리셋</button>
          </div>
        </div>
      </div>

      <div class="section-title">오늘의 운동</div>
      <div class="exercise-list" id="exerciseList"></div>
      <div class="add-exercise-form">
        <input type="text" id="exerciseInput" placeholder="운동명 (예: 벤치프레스)">
        <button id="exerciseAdd">추가</button>
      </div>
    </section>

    <!-- ============ TAB: 쇠타이머 (REST) ============ -->
    <section class="tab-panel" data-tab="timer" hidden>
      <div class="timer-hero">
        <div class="timer-label">REST TIMER</div>
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-controls">
          <button class="primary" id="timerToggle">시작</button>
          <button id="timerReset">리셋</button>
        </div>
        <div class="timer-adjust">
          <button id="timerMinus">-10s</button>
          <button id="timerPlus">+10s</button>
        </div>
      </div>
      <div class="section-title">프리셋</div>
      <div class="timer-presets" id="timerPresets">
        <button class="timer-preset" data-sec="30">30<small>SEC</small></button>
        <button class="timer-preset" data-sec="45">45<small>SEC</small></button>
        <button class="timer-preset" data-sec="60">1<small>MIN</small></button>
        <button class="timer-preset" data-sec="90">1:30<small>MIN</small></button>
        <button class="timer-preset" data-sec="120">2<small>MIN</small></button>
        <button class="timer-preset" data-sec="180">3<small>MIN</small></button>
        <button class="timer-preset" data-sec="240">4<small>MIN</small></button>
        <button class="timer-preset" data-sec="300">5<small>MIN</small></button>
      </div>
      <div class="section-title">사용자 설정</div>
      <div class="timer-custom">
        <input type="number" id="timerCustomInput" placeholder="초">
        <span class="unit">초</span>
        <button id="timerCustomSet">설정</button>
      </div>
    </section>

    <!-- ============ TAB 3: 쇠스탯 ============ -->
    <section class="tab-panel" data-tab="stats" hidden>
      <div class="section-title">몸무게</div>
      <div class="stat-card">
        <div class="weight-input-row">
          <input type="number" step="0.1" id="weightInput" placeholder="오늘 몸무게">
          <span class="unit">kg</span>
          <button id="weightSave">기록</button>
        </div>
        <div class="weight-chart" id="weightChart"></div>
      </div>

      <div class="section-title">1RM 계산기</div>
      <div class="stat-card">
        <div class="stat-title">EPLEY 공식 · 무게 × (1 + 반복/30)</div>
        <div class="rm-calc">
          <input type="number" id="rmWeight" placeholder="무게">
          <input type="number" id="rmReps" placeholder="반복">
          <div class="rm-out" id="rmOut">— <span>kg</span></div>
        </div>
      </div>

      <div class="section-title">3대 500 도전</div>
      <div class="stat-card">
        <div class="big3-list">
          <div class="big3-row">
            <span class="name">벤치</span>
            <input type="number" data-lift="bench" placeholder="1RM">
            <span class="unit">kg</span>
          </div>
          <div class="big3-row">
            <span class="name">스쿼트</span>
            <input type="number" data-lift="squat" placeholder="1RM">
            <span class="unit">kg</span>
          </div>
          <div class="big3-row">
            <span class="name">데드</span>
            <input type="number" data-lift="deadlift" placeholder="1RM">
            <span class="unit">kg</span>
          </div>
        </div>
        <div class="big3-total">
          <span class="label">TOTAL</span>
          <span class="value"><span id="big3Total">0</span><small>kg</small></span>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ 가로 모드 전용 뷰 (구버전 시계+스톱워치) ============ -->
  <div class="lm-view" aria-hidden="true">
    <section class="lm-section">
      <div class="lm-label">Now</div>
      <div class="lm-time" id="lmClock">00:00:00</div>
    </section>
    <section class="lm-section">
      <div class="lm-label"><span class="lm-live-dot" id="lmLiveDot"></span>Stopwatch</div>
      <div class="lm-time" id="lmSw">00:00:00</div>
    </section>
    <button class="lm-round-btn lm-left primary" id="lmToggle">시작</button>
    <button class="lm-round-btn lm-right" id="lmReset">리셋</button>
  </div>

  <nav class="gnb">
    <button class="gnb-btn active" data-target="schedule">
      <span class="gnb-icon">CAL</span><span>일정</span>
    </button>
    <button class="gnb-btn" data-target="plan">
      <span class="gnb-icon">PLN</span><span>루틴</span>
    </button>
    <button class="gnb-btn" data-target="workout">
      <span class="gnb-icon">LOG</span><span>기록</span>
    </button>
    <button class="gnb-btn" data-target="timer">
      <span class="gnb-icon">RST</span><span>타이머</span>
    </button>
    <button class="gnb-btn" data-target="stats">
      <span class="gnb-icon">1RM</span><span>스탯</span>
    </button>
  </nav>

<script>
  // ============ 공통 유틸 ============
  const pad2 = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const todayKey = () => dateKey(new Date());
  // HH:MM:SS 각 자릿수를 고정폭 span으로 감싸서 숫자값(1/8 등)에 관계없이 폭 유지
  function digitSpans(str) {
    let out = '';
    for (const c of str) {
      if (c === ':') out += `<span class="colon">${c}</span>`;
      else out += `<span class="digit">${c}</span>`;
    }
    return out;
  }
  const store = {
    get(k, def) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; }
    },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ============ 확대/축소 제스처 차단 ============
  ['gesturestart','gesturechange','gestureend'].forEach(evt => {
    document.addEventListener(evt, e => e.preventDefault(), { passive: false });
  });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 320) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ============ GNB / 탭 전환 ============
  const gnbBtns = document.querySelectorAll('.gnb-btn');
  const panels = document.querySelectorAll('.tab-panel');
  function switchTab(target) {
    panels.forEach(p => { p.hidden = (p.dataset.tab !== target); });
    gnbBtns.forEach(b => b.classList.toggle('active', b.dataset.target === target));
    // 기록 탭 진입 시 히어로 폰트 재적합 + Wake Lock 확보 (화면 꺼짐 방지)
    if (target === 'workout') {
      requestAnimationFrame(() => {
        if (typeof swRender === 'function') swRender();
        if (typeof renderTodayHero === 'function') renderTodayHero();
        if (window._acquireWakeLock) window._acquireWakeLock();
      });
    }
    // 타이머 탭도 Wake Lock 유지 (휴식 중 화면 꺼짐 방지)
    if (target === 'timer' && window._acquireWakeLock) {
      window._acquireWakeLock();
    }
  }
  gnbBtns.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.target)));

  // ============ 1. 캘린더 (쇠일정) ============
  const KEY_SCHEDULE = 'sw_schedule_v1';
  let scheduleData = store.get(KEY_SCHEDULE, {}); // { 'YYYY-MM-DD': ['일정1','일정2'] }
  let calCursor = new Date();  calCursor.setDate(1);
  let selectedKey = todayKey();

  const calGrid = document.getElementById('calGrid');
  const calTitle = document.getElementById('calTitle');
  const scheduleDateEl = document.getElementById('scheduleDate');
  const scheduleListEl = document.getElementById('scheduleList');
  const scheduleInput = document.getElementById('scheduleInput');

  function renderCalendar() {
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    calTitle.textContent = `${y} · ${pad2(m+1)}`;
    calGrid.innerHTML = '';
    const first = new Date(y, m, 1);
    const startDay = first.getDay(); // 0=일
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrev = new Date(y, m, 0).getDate();
    const todayK = todayKey();

    // 이전 달 여백 채우기
    for (let i = startDay - 1; i >= 0; i--) {
      const d = daysInPrev - i;
      calGrid.appendChild(makeCell(d, `${y}-${pad2(m)}-${pad2(d)}`, true, todayK));
    }
    // 현재 달
    for (let d = 1; d <= daysInMonth; d++) {
      const k = `${y}-${pad2(m+1)}-${pad2(d)}`;
      calGrid.appendChild(makeCell(d, k, false, todayK));
    }
    // 다음 달 여백 채우기 (총 42칸)
    const filled = startDay + daysInMonth;
    const rest = (7 - (filled % 7)) % 7;
    for (let d = 1; d <= rest; d++) {
      const k = `${y}-${pad2(m+2)}-${pad2(d)}`;
      calGrid.appendChild(makeCell(d, k, true, todayK));
    }
    renderSchedulePanel();
  }

  function makeCell(day, key, otherMonth, todayK) {
    const el = document.createElement('div');
    el.className = 'cal-cell';
    if (otherMonth) el.classList.add('other-month');
    if (key === todayK) el.classList.add('today');
    if (key === selectedKey) el.classList.add('selected');
    if (scheduleData[key] && scheduleData[key].length) el.classList.add('has-items');
    el.textContent = day;
    el.addEventListener('click', () => {
      selectedKey = key;
      // 다른 달 클릭 시 커서 이동
      if (otherMonth) {
        const [yy, mm] = key.split('-').map(Number);
        calCursor = new Date(yy, mm - 1, 1);
      }
      renderCalendar();
    });
    return el;
  }

  function renderSchedulePanel() {
    const items = scheduleData[selectedKey] || [];
    scheduleDateEl.textContent = formatSelectedDate(selectedKey);
    scheduleListEl.innerHTML = '';
    if (items.length === 0) {
      const p = document.createElement('div');
      p.className = 'schedule-empty';
      p.textContent = '일정 없음';
      scheduleListEl.appendChild(p);
    } else {
      items.forEach((text, idx) => {
        const row = document.createElement('div');
        row.className = 'schedule-item';
        const t = document.createElement('div'); t.className = 'text'; t.textContent = text;
        const b = document.createElement('button'); b.className = 'del'; b.textContent = '×';
        b.addEventListener('click', () => {
          scheduleData[selectedKey].splice(idx, 1);
          if (scheduleData[selectedKey].length === 0) delete scheduleData[selectedKey];
          store.set(KEY_SCHEDULE, scheduleData);
          renderCalendar();
        });
        row.appendChild(t); row.appendChild(b);
        scheduleListEl.appendChild(row);
      });
    }
  }
  function formatSelectedDate(k) {
    const [y,m,d] = k.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
    return `${m}월 ${d}일 (${dow})`;
  }

  document.getElementById('calPrev').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });
  document.getElementById('calToday').addEventListener('click', () => { calCursor = new Date(); calCursor.setDate(1); selectedKey = todayKey(); renderCalendar(); });

  document.getElementById('scheduleAdd').addEventListener('click', () => addSchedule());
  scheduleInput.addEventListener('keydown', e => { if (e.key === 'Enter') addSchedule(); });
  function addSchedule() {
    const v = scheduleInput.value.trim();
    if (!v) return;
    if (!scheduleData[selectedKey]) scheduleData[selectedKey] = [];
    scheduleData[selectedKey].push(v);
    store.set(KEY_SCHEDULE, scheduleData);
    scheduleInput.value = '';
    renderCalendar();
  }

  // ============ 2. 쇠기록 (오늘 날짜/시간/스톱워치/운동) ============
  const KEY_WORKOUT = 'sw_workout_v1';
  let workoutData = store.get(KEY_WORKOUT, {});
  const todayDateEl = document.getElementById('todayDate');
  const todayTimeEl = document.getElementById('todayTime');
  const exListEl = document.getElementById('exerciseList');
  const exInput = document.getElementById('exerciseInput');

  const lmClockEl = document.getElementById('lmClock');
  const dowFull = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  function renderTodayHero() {
    const d = new Date();
    const dayName = dowFull[d.getDay()];
    // 날짜 = 2줄 스택 (MM.DD / 요일). 이미 존재하는 자식 요소 텍스트만 갱신
    const mainEl = todayDateEl.querySelector('.wh-date-main');
    const subEl = todayDateEl.querySelector('.wh-date-sub');
    if (mainEl) mainEl.textContent = `${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`;
    if (subEl) subEl.textContent = dayName;
    const t = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    todayTimeEl.innerHTML = digitSpans(t);
    if (lmClockEl) lmClockEl.innerHTML = digitSpans(t);
  }
  setInterval(() => renderTodayHero(), 1000);  // 화살표로 감싸 재할당된 wrap 버전 반영
  renderTodayHero();

  function renderExercises() {
    const list = workoutData[todayKey()] || [];
    exListEl.innerHTML = '';
    list.forEach((ex, idx) => {
      const card = document.createElement('div');
      card.className = 'exercise-card';
      const head = document.createElement('div'); head.className = 'exercise-head';
      const nm = document.createElement('div'); nm.className = 'exercise-name'; nm.textContent = ex.name;
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
      del.addEventListener('click', () => {
        workoutData[todayKey()].splice(idx, 1);
        if (workoutData[todayKey()].length === 0) delete workoutData[todayKey()];
        store.set(KEY_WORKOUT, workoutData);
        renderExercises();
      });
      head.appendChild(nm); head.appendChild(del); card.appendChild(head);

      const chips = document.createElement('div'); chips.className = 'set-list';
      (ex.sets || []).forEach((s, si) => {
        const c = document.createElement('span'); c.className = 'set-chip';
        c.innerHTML = `${s.weight}<span class="rm">×</span>${s.reps}`;
        const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×';
        rm.addEventListener('click', () => {
          ex.sets.splice(si, 1);
          store.set(KEY_WORKOUT, workoutData);
          renderExercises();
        });
        c.appendChild(rm);
        chips.appendChild(c);
      });
      card.appendChild(chips);

      const inputRow = document.createElement('div'); inputRow.className = 'set-input-row';
      const wIn = Object.assign(document.createElement('input'), { type: 'number', placeholder: '무게(kg)', step: '0.5' });
      const rIn = Object.assign(document.createElement('input'), { type: 'number', placeholder: '반복', step: '1' });
      const add = document.createElement('button'); add.className = 'add-set'; add.textContent = '세트 +';
      add.addEventListener('click', () => {
        const w = parseFloat(wIn.value), r = parseInt(rIn.value);
        if (isNaN(w) || isNaN(r) || w <= 0 || r <= 0) return;
        if (!ex.sets) ex.sets = [];
        ex.sets.push({ weight: w, reps: r });
        store.set(KEY_WORKOUT, workoutData);
        wIn.value = ''; rIn.value = '';
        renderExercises();
      });
      inputRow.appendChild(wIn); inputRow.appendChild(rIn); inputRow.appendChild(add);
      card.appendChild(inputRow);

      exListEl.appendChild(card);
    });
  }

  document.getElementById('exerciseAdd').addEventListener('click', () => {
    const v = exInput.value.trim();
    if (!v) return;
    const k = todayKey();
    if (!workoutData[k]) workoutData[k] = [];
    workoutData[k].push({ name: v, sets: [] });
    store.set(KEY_WORKOUT, workoutData);
    exInput.value = '';
    renderExercises();
  });
  exInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('exerciseAdd').click(); });
  renderExercises();

  // ============ 스톱워치 (세로 wh-sw-display + 가로 lm-sw 동시 업데이트) ============
  const swDisplay = document.getElementById('swDisplay');
  const swToggle = document.getElementById('swToggle');
  const swReset = document.getElementById('swReset');
  const lmSw = document.getElementById('lmSw');
  const lmToggle = document.getElementById('lmToggle');
  const lmReset = document.getElementById('lmReset');
  const lmLiveDot = document.getElementById('lmLiveDot');
  let swRunning = false, swStart = 0, swElapsed = 0, swRaf = null;
  function swRender() {
    const now = swRunning ? (Date.now() - swStart + swElapsed) : swElapsed;
    const total = Math.max(0, Math.floor(now / 1000));
    const h = Math.floor(total/3600), m = Math.floor(total/60)%60, s = total%60;
    const str = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    swDisplay.innerHTML = digitSpans(str);
    if (lmSw) lmSw.innerHTML = digitSpans(str);
  }
  function swTick() { swRender(); swRaf = requestAnimationFrame(swTick); }
  function swStartFn() {
    if (swRunning) return;
    swRunning = true;
    swStart = Date.now();
    swToggle.textContent = '정지';
    swDisplay.classList.add('running');
    if (lmToggle) { lmToggle.textContent = '정지'; lmToggle.classList.add('running'); }
    if (lmSw) lmSw.classList.add('running');
    if (lmLiveDot) lmLiveDot.classList.add('on');
    swTick();
  }
  function swStopFn() {
    if (!swRunning) return;
    swRunning = false;
    swElapsed += Date.now() - swStart;
    if (swRaf) cancelAnimationFrame(swRaf);
    swRaf = null;
    swToggle.textContent = '시작';
    swDisplay.classList.remove('running');
    if (lmToggle) { lmToggle.textContent = '시작'; lmToggle.classList.remove('running'); }
    if (lmSw) lmSw.classList.remove('running');
    if (lmLiveDot) lmLiveDot.classList.remove('on');
    swRender();
  }
  function swResetFn() {
    if (swRunning) return;
    swElapsed = 0; swStart = 0; swRender();
  }
  swToggle.addEventListener('click', () => swRunning ? swStopFn() : swStartFn());
  swReset.addEventListener('click', swResetFn);
  if (lmToggle) lmToggle.addEventListener('click', () => swRunning ? swStopFn() : swStartFn());
  if (lmReset) lmReset.addEventListener('click', swResetFn);

  // HH:MM:SS의 예상 폭 = 6개 digit(0.58em) + 2개 colon(0.24em) = 3.96em
  // scrollWidth 대신 이 상수를 쓰면 자릿수 값에 따라 폭이 흔들리지 않음
  const DIGIT_TIME_EM = 3.96;
  function fitDigitDisplay(el, availWidth) {
    if (!el || !el.offsetParent) return;
    el.style.fontSize = '';
    const cur = parseFloat(getComputedStyle(el).fontSize);
    const targetWidth = cur * DIGIT_TIME_EM;
    if (targetWidth > availWidth && availWidth > 0) {
      el.style.fontSize = (cur * (availWidth / targetWidth)) + 'px';
    }
  }
  // 일반 텍스트용 (날짜 등) — 여전히 scrollWidth 기반
  function fitToWidth(el, ratio = 0.98) {
    if (!el || !el.offsetParent) return;
    el.style.fontSize = '';
    const parent = el.parentElement;
    if (!parent) return;
    const avail = parent.clientWidth * ratio;
    const natural = el.scrollWidth;
    if (natural > avail && natural > 0) {
      const cur = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = (cur * (avail / natural)) + 'px';
    }
  }
  const whMetaEl = document.querySelector('.wh-meta');
  function fitTime() {
    if (!todayTimeEl || !todayTimeEl.offsetParent) return;
    const gap = 12;
    const avail = whMetaEl.clientWidth * 0.98 - todayDateEl.scrollWidth - gap;
    fitDigitDisplay(todayTimeEl, avail);
  }
  function fitSwDisplayCentered() {
    if (!swDisplay || !swDisplay.offsetParent) return;
    const parent = swDisplay.parentElement;
    if (!parent) return;
    fitDigitDisplay(swDisplay, parent.clientWidth * 0.98);
  }
  // 가로 모드 lm-clock / lm-sw는 scaleX(1.05) 적용이라 5% 여유를 미리 빼고 fit
  // 주의: section.clientWidth를 쓰면 lm-time 축소 → section 축소 → 다시 축소... 피드백 루프 발생.
  // 따라서 viewport 크기와 CSS clamp 공식으로 avail을 상수 계산 (레이아웃 측정 안 함)
  const _clamp = (mn, v, mx) => Math.min(Math.max(mn, v), mx);
  function fitLandscapeTime(el) {
    if (!el || !el.offsetParent) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const btn = _clamp(112, vh * 0.26, 190);      // .lm-round-btn width
    const gutter = _clamp(16, vw * 0.04, 48);      // .lm-round-btn 좌우 여백
    const parentW = vw - 32;                       // .lm-view padding 16*2
    const sectionMaxW = parentW - 2 * (btn + gutter + 20);
    const avail = (sectionMaxW * 0.98) / 1.05;
    fitDigitDisplay(el, avail);
  }
  function fitHero() {
    fitTime();
    fitSwDisplayCentered();
    fitLandscapeTime(lmClockEl);
    fitLandscapeTime(lmSw);
  }
  const _origSwRender = swRender;
  swRender = function() { _origSwRender(); fitSwDisplayCentered(); fitLandscapeTime(lmSw); };
  const _origRenderTodayHero = renderTodayHero;
  renderTodayHero = function() { _origRenderTodayHero(); fitTime(); fitLandscapeTime(lmClockEl); };
  window.addEventListener('resize', fitHero);
  window.addEventListener('orientationchange', () => setTimeout(fitHero, 120));
  swRender();

  // ============ 3. 쇠스탯 ============
  const KEY_WT = 'sw_bodyweight_v1';
  const KEY_1RM = 'sw_1rm_v1';
  let wtData = store.get(KEY_WT, {}); // { 'YYYY-MM-DD': kg }
  let big3Data = store.get(KEY_1RM, { bench: 0, squat: 0, deadlift: 0 });

  const weightInput = document.getElementById('weightInput');
  const weightChart = document.getElementById('weightChart');
  document.getElementById('weightSave').addEventListener('click', () => {
    const v = parseFloat(weightInput.value);
    if (isNaN(v) || v <= 0) return;
    wtData[todayKey()] = v;
    store.set(KEY_WT, wtData);
    weightInput.value = '';
    renderWeightChart();
  });

  function renderWeightChart() {
    weightChart.innerHTML = '';
    const days = 7;
    const now = new Date();
    const values = [];
    const labels = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      const k = dateKey(d);
      values.push(wtData[k] || null);
      labels.push(pad2(d.getDate()));
    }
    const nums = values.filter(v => v != null);
    const min = nums.length ? Math.min(...nums) : 0;
    const max = nums.length ? Math.max(...nums) : 0;
    const range = Math.max(1, max - min);
    for (let i = 0; i < days; i++) {
      const bar = document.createElement('div'); bar.className = 'weight-bar';
      const b = document.createElement('div'); b.className = 'bar';
      const v = values[i];
      if (v == null) {
        b.style.height = '2px'; b.style.opacity = '0.15';
      } else {
        const pct = nums.length > 1 ? ((v - min) / range) * 78 + 12 : 60;
        b.style.height = pct + '%';
      }
      const wt = document.createElement('div'); wt.className = 'wt-label';
      wt.textContent = v != null ? v.toFixed(1) : '';
      const dl = document.createElement('div'); dl.className = 'day-label'; dl.textContent = labels[i];
      bar.appendChild(wt); bar.appendChild(b); bar.appendChild(dl);
      weightChart.appendChild(bar);
    }
  }
  renderWeightChart();

  // 1RM 계산기
  const rmWeight = document.getElementById('rmWeight');
  const rmReps = document.getElementById('rmReps');
  const rmOut = document.getElementById('rmOut');
  function calc1RM() {
    const w = parseFloat(rmWeight.value), r = parseInt(rmReps.value);
    if (isNaN(w) || isNaN(r) || w <= 0 || r <= 0) { rmOut.innerHTML = '— <span>kg</span>'; return; }
    const rm = w * (1 + r/30);
    rmOut.innerHTML = `${rm.toFixed(1)} <span>kg</span>`;
  }
  rmWeight.addEventListener('input', calc1RM);
  rmReps.addEventListener('input', calc1RM);

  // 3대 총합
  const big3Inputs = document.querySelectorAll('input[data-lift]');
  const big3TotalEl = document.getElementById('big3Total');
  function renderBig3() {
    big3Inputs.forEach(inp => {
      const v = big3Data[inp.dataset.lift];
      inp.value = v > 0 ? v : '';
    });
    const total = (big3Data.bench||0) + (big3Data.squat||0) + (big3Data.deadlift||0);
    big3TotalEl.textContent = total;
  }
  big3Inputs.forEach(inp => {
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value) || 0;
      big3Data[inp.dataset.lift] = v;
      store.set(KEY_1RM, big3Data);
      const total = (big3Data.bench||0) + (big3Data.squat||0) + (big3Data.deadlift||0);
      big3TotalEl.textContent = total;
    });
  });
  renderBig3();

  // ============ 쇠루틴 (PLAN) ============
  const KEY_ROUTINES = 'sw_routines_v1';
  const defaultRoutines = [
    { id: 'r_push', name: '가슴 + 삼두', exercises: ['벤치프레스', '인클라인 덤벨프레스', '케이블 플라이', '트라이셉 익스텐션'] },
    { id: 'r_pull', name: '등 + 이두', exercises: ['데드리프트', '랫풀다운', '바벨 로우', '덤벨 컬'] },
    { id: 'r_legs', name: '하체', exercises: ['스쿼트', '레그프레스', '루마니안 데드리프트', '카프레이즈'] },
  ];
  let routines = store.get(KEY_ROUTINES, defaultRoutines);
  const routineListEl = document.getElementById('routineList');
  const routineNameInput = document.getElementById('routineNameInput');

  function renderRoutines() {
    routineListEl.innerHTML = '';
    if (!routines.length) {
      const p = document.createElement('div');
      p.className = 'schedule-empty';
      p.textContent = '아직 루틴이 없습니다. 아래에서 추가하세요.';
      routineListEl.appendChild(p);
      return;
    }
    routines.forEach((r, idx) => {
      const card = document.createElement('div'); card.className = 'routine-card';

      const head = document.createElement('div'); head.className = 'routine-head';
      const name = document.createElement('div'); name.className = 'routine-name'; name.textContent = r.name;
      const badge = document.createElement('span'); badge.className = 'routine-badge'; badge.textContent = `${(r.exercises||[]).length} EX`;
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
      del.addEventListener('click', () => {
        if (!confirm(`'${r.name}' 루틴을 삭제할까요?`)) return;
        routines.splice(idx, 1);
        store.set(KEY_ROUTINES, routines);
        renderRoutines();
      });
      head.appendChild(name); head.appendChild(badge); head.appendChild(del);
      card.appendChild(head);

      const chips = document.createElement('div'); chips.className = 'routine-exercises';
      if (!r.exercises || r.exercises.length === 0) {
        const e = document.createElement('span'); e.className = 'routine-empty-ex'; e.textContent = '운동 없음'; chips.appendChild(e);
      } else {
        r.exercises.forEach((ex, exi) => {
          const chip = document.createElement('span'); chip.className = 'routine-ex-chip'; chip.textContent = ex;
          const rm = document.createElement('span'); rm.className = 'rm'; rm.textContent = '×';
          rm.addEventListener('click', () => {
            r.exercises.splice(exi, 1);
            store.set(KEY_ROUTINES, routines);
            renderRoutines();
          });
          chip.appendChild(rm);
          chips.appendChild(chip);
        });
      }
      card.appendChild(chips);

      // 운동 추가 입력
      const addRow = document.createElement('div'); addRow.className = 'routine-add-ex';
      const addInput = Object.assign(document.createElement('input'), { type: 'text', placeholder: '운동 추가' });
      const addBtn = document.createElement('button'); addBtn.textContent = '+ 운동';
      const doAdd = () => {
        const v = addInput.value.trim();
        if (!v) return;
        if (!r.exercises) r.exercises = [];
        r.exercises.push(v);
        store.set(KEY_ROUTINES, routines);
        renderRoutines();
      };
      addBtn.addEventListener('click', doAdd);
      addInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
      addRow.appendChild(addInput); addRow.appendChild(addBtn);
      card.appendChild(addRow);

      // 오늘 기록으로 복사
      const apply = document.createElement('button'); apply.className = 'routine-apply';
      apply.textContent = '→ 오늘 기록으로 복사';
      apply.addEventListener('click', () => {
        const k = todayKey();
        const existing = workoutData[k] || [];
        const existingNames = new Set(existing.map(e => e.name));
        let added = 0;
        (r.exercises || []).forEach(name => {
          if (!existingNames.has(name)) {
            existing.push({ name, sets: [] });
            added++;
          }
        });
        workoutData[k] = existing;
        store.set(KEY_WORKOUT, workoutData);
        renderExercises();
        switchTab('workout');
        if (added === 0) alert('이미 오늘 기록에 모두 추가되어 있습니다.');
      });
      card.appendChild(apply);

      routineListEl.appendChild(card);
    });
  }
  document.getElementById('routineCreate').addEventListener('click', () => {
    const v = routineNameInput.value.trim();
    if (!v) return;
    routines.push({ id: 'r_' + Date.now(), name: v, exercises: [] });
    store.set(KEY_ROUTINES, routines);
    routineNameInput.value = '';
    renderRoutines();
  });
  routineNameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('routineCreate').click();
  });
  renderRoutines();

  // ============ 쇠타이머 (REST) ============
  const KEY_TIMER_LAST = 'sw_timer_last_v1';
  const timerDisplay = document.getElementById('timerDisplay');
  const timerToggle = document.getElementById('timerToggle');
  const timerReset = document.getElementById('timerReset');
  const timerMinus = document.getElementById('timerMinus');
  const timerPlus = document.getElementById('timerPlus');
  const timerCustomInput = document.getElementById('timerCustomInput');
  const timerCustomSet = document.getElementById('timerCustomSet');
  const timerPresetBtns = document.querySelectorAll('.timer-preset');

  let timerTotalSec = store.get(KEY_TIMER_LAST, 60);
  let timerRemainMs = timerTotalSec * 1000;
  let timerRunning = false;
  let timerEndAt = 0;
  let timerRaf = null;
  let timerAlertCount = 0;
  let audioCtx = null;

  function fmtTimer(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60), s = total % 60;
    return `${pad2(m)}:${pad2(s)}`;
  }
  function renderTimer() {
    const ms = timerRunning ? Math.max(0, timerEndAt - Date.now()) : timerRemainMs;
    timerDisplay.innerHTML = digitSpans(fmtTimer(ms));
    if (timerRunning && ms <= 0) {
      timerRunning = false;
      cancelAnimationFrame(timerRaf);
      timerRaf = null;
      timerRemainMs = 0;
      timerToggle.textContent = '시작';
      timerDisplay.classList.remove('running');
      timerDisplay.classList.add('alert');
      playAlert();
      if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 600]);
      setTimeout(() => {
        timerDisplay.classList.remove('alert');
        timerRemainMs = timerTotalSec * 1000;
        renderTimer();
      }, 3200);
    }
  }
  function timerTick() {
    renderTimer();
    if (timerRunning) timerRaf = requestAnimationFrame(timerTick);
  }
  function playAlert() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const freq = [880, 880, 1320];
      freq.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = f;
        osc.type = 'square';
        gain.gain.setValueAtTime(0.001, audioCtx.currentTime + i * 0.35);
        gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + i * 0.35 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.35 + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.35);
        osc.stop(audioCtx.currentTime + i * 0.35 + 0.32);
      });
    } catch {}
  }
  function timerStart() {
    if (timerRunning) return;
    if (timerRemainMs <= 0) timerRemainMs = timerTotalSec * 1000;
    timerRunning = true;
    timerEndAt = Date.now() + timerRemainMs;
    timerToggle.textContent = '일시정지';
    timerDisplay.classList.add('running');
    timerDisplay.classList.remove('alert');
    timerTick();
    // 오디오 활성화 (브라우저 자동재생 정책)
    try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  }
  function timerStop() {
    if (!timerRunning) return;
    timerRemainMs = Math.max(0, timerEndAt - Date.now());
    timerRunning = false;
    cancelAnimationFrame(timerRaf);
    timerRaf = null;
    timerToggle.textContent = '시작';
    timerDisplay.classList.remove('running');
    renderTimer();
  }
  function timerResetFn() {
    if (timerRunning) timerStop();
    timerRemainMs = timerTotalSec * 1000;
    timerDisplay.classList.remove('alert');
    renderTimer();
  }
  function setTimerTotal(sec) {
    timerTotalSec = Math.max(1, sec | 0);
    store.set(KEY_TIMER_LAST, timerTotalSec);
    if (!timerRunning) {
      timerRemainMs = timerTotalSec * 1000;
      renderTimer();
    }
    timerPresetBtns.forEach(b => b.classList.toggle('active', +b.dataset.sec === timerTotalSec));
  }
  function timerAdjust(delta) {
    if (timerRunning) {
      timerEndAt += delta * 1000;
      renderTimer();
    } else {
      timerRemainMs = Math.max(0, timerRemainMs + delta * 1000);
      renderTimer();
    }
  }

  timerToggle.addEventListener('click', () => timerRunning ? timerStop() : timerStart());
  timerReset.addEventListener('click', timerResetFn);
  timerMinus.addEventListener('click', () => timerAdjust(-10));
  timerPlus.addEventListener('click', () => timerAdjust(10));
  timerPresetBtns.forEach(b => b.addEventListener('click', () => setTimerTotal(+b.dataset.sec)));
  timerCustomSet.addEventListener('click', () => {
    const v = parseInt(timerCustomInput.value);
    if (isNaN(v) || v <= 0) return;
    setTimerTotal(v);
    timerCustomInput.value = '';
  });
  timerCustomInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') timerCustomSet.click();
  });
  setTimerTotal(timerTotalSec);  // 초기 렌더 + 활성 프리셋 표시

  // ============ Wake Lock (기록 탭·스톱워치 사용 중 화면 꺼짐 방지) ============
  let wakeLock = null;
  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    if (wakeLock) return; // 중복 요청 방지
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch { /* NotAllowedError 등 무시 */ }
  }
  async function releaseWakeLock() {
    if (!wakeLock) return;
    try { await wakeLock.release(); } catch {}
    wakeLock = null;
  }
  // 초기 시도 (제스처 없어 실패할 수 있음)
  acquireWakeLock();
  // 사용자 첫 탭/클릭 시 확실히 재요청
  document.addEventListener('click', () => acquireWakeLock(), { once: false });
  // 백그라운드 복귀 시 재요청
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') acquireWakeLock();
  });
  // 스톱워치 시작 시에도 명시적으로 확보
  const _origSwStart = swStartFn;
  swStartFn = function() { _origSwStart(); acquireWakeLock(); };
  // switchTab에서 기록 탭 진입 시 wake lock 확보 (아래에서 참조)
  window._acquireWakeLock = acquireWakeLock;

  // ============ 초기 ============
  renderCalendar();

  // ============ Service Worker (신규 버전 자동 활성화) ============
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // 페이지 열릴 때마다 업데이트 확인
        reg.update();
        // 새 버전이 대기 중이면 즉시 활성화 → 다음 새로고침에 반영
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              nw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      }).catch(() => {});
      // 컨트롤러가 바뀌면 페이지 자동 리로드 (한 번만)
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
